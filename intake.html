<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Intake</title>
<script>
/* =====================================================================
 *  OWNER INTAKE PAGE — intake-v1 (private: not linked from the site)
 *  Orders, automatic quotes, your discount, before/after photos and notes.
 *  Edit only this CONFIG block. The PIN is set in Code.gs (INTAKE_PIN).
 * ===================================================================== */
const CONFIG = {
  business: 'PH Restoration Labs',
  build: 'labs-intake-v1',
  endpoint: 'https://script.google.com/macros/s/AKfycbzuZEQkwp7jn6xx0FpMSk7TayiKOytf3FZEFQLrIaMzzPH2x59n_JBtDyZg-36fEB-K/exec',
  cloudinaryCloud: 'zwhk0ifp',
  cloudinaryPreset: 'hegphlku',
  item: 'card', items: 'cards',
  theme: { bg: '#070707', panel: '#111111', panel2: '#1a1814', line: '#3a3020', text: '#f7f5f0', muted: '#b9b1a1',
           accent: '#f2b631', onAccent: '#140d00', highlight: '#e09c14', onHighlight: '#140d00' },
  fonts: { display: 'Barlow Condensed', displayWeights: '700;800', displayUpper: true, body: 'Barlow', bodyWeights: '400;500;600;700' }
};
</script>
<style>
:root{
  --ok:#1e8a46; --ok-soft:color-mix(in srgb, var(--ok) 14%, transparent);
  --warn:#b26a00; --warn-soft:color-mix(in srgb, #f0a020 18%, transparent);
  --bad:#c62f26; --bad-soft:color-mix(in srgb, var(--bad) 12%, transparent);
  --r:10px; --r-sm:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--f-body); min-height:100vh}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); text-transform:var(--display-case); margin:0; line-height:1.1; letter-spacing:.01em}
.wrap{max-width:880px; margin:0 auto; padding:0 16px}
header.top{background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5}
header.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px}
.brand{font-family:var(--f-display); text-transform:var(--display-case); font-size:20px}
.brand small{font-family:var(--f-body); text-transform:none; color:var(--muted); font-size:14px; margin-left:8px}
main{padding:22px 0 80px}
button, input, textarea, select{font:inherit; color:inherit}
.btn{border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); border-radius:var(--r-sm); padding:10px 16px; font-weight:700; cursor:pointer; min-height:44px}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn.small{min-height:34px; padding:6px 12px; font-size:14px}
.btn[disabled]{opacity:.55; cursor:not-allowed}
input[type=text], input[type=password], input[type=search], textarea{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; width:100%; min-height:44px}
textarea{min-height:84px; resize:vertical}
input:focus, textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.muted{color:var(--muted)}
.err{color:var(--bad)}

/* PIN */
.pin{max-width:360px; margin:12vh auto 0; display:grid; gap:14px; text-align:center}
.pin h1{font-size:34px}
.pin input{font-size:24px; text-align:center; letter-spacing:.3em}

/* list */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.toolbar input{flex:1 1 220px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
.seg button{border:0; background:transparent; padding:8px 14px; cursor:pointer; min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:700}
.orders{display:grid; gap:8px}
.order{display:grid; grid-template-columns:1fr auto; gap:4px 14px; text-align:left; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; cursor:pointer}
.order:hover{border-color:var(--accent)}
.order .who{font-weight:800}
.order .ref{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; color:var(--muted)}
.order .amt{grid-row:1 / span 2; grid-column:2; align-self:center; text-align:right; font-weight:800; font-size:18px}
.order .amt small{display:block; font-weight:400; font-size:12px; color:var(--muted)}
.tags{display:flex; flex-wrap:wrap; gap:6px; grid-column:1}
.tag{font-size:12px; border-radius:4px; padding:2px 7px; background:var(--panel2); color:var(--muted); white-space:nowrap}
.tag.warn{background:var(--warn-soft); color:var(--warn); font-weight:700}
.tag.ok{background:var(--ok-soft); color:var(--ok); font-weight:700}
.empty{border:1px dashed var(--line); border-radius:var(--r); padding:24px; text-align:center; color:var(--muted)}

/* order */
.back{margin-bottom:14px}
.ohead{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:16px}
.ohead h1{font-size:30px}
.contact{display:grid; gap:2px; font-size:15px; margin-top:6px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.quote{border:2px solid var(--highlight); margin-bottom:18px}
.quote h2{font-size:20px; margin-bottom:10px}
.qline{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); font-size:15px}
.qline .bd{display:block; color:var(--muted); font-size:13px}
.qline b{white-space:nowrap}
.qtotal{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px}
.qtotal .big{font-family:var(--f-display); font-size:34px; color:var(--text)}
.disc{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center}
.disc input{width:140px; flex:none}
.qnotes{margin:12px 0 0; padding:10px 12px 10px 28px; background:var(--warn-soft); border-radius:var(--r-sm); color:var(--text); font-size:14px}
.card{margin-bottom:14px}
.card .chead{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.card h3{font-size:20px}
.facts{display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; margin:10px 0; font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
.ph{margin-top:14px}
.ph > b{display:block; font-size:14px; margin-bottom:6px}
.strip{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start}
.thumb{position:relative; width:86px}
.thumb a{display:block}
.thumb img{width:86px; height:114px; object-fit:cover; border-radius:5px; border:1px solid var(--line); background:var(--panel2); display:block}
.thumb span{display:block; font-size:12px; color:var(--muted); text-align:center}
.thumb .x{position:absolute; top:-7px; right:-7px; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--bad); font-weight:800; cursor:pointer; line-height:1}
.add{width:86px; height:114px; border:2px dashed var(--line); border-radius:5px; display:grid; place-items:center; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; background:var(--panel2); padding:4px}
.add:hover{border-color:var(--accent); color:var(--accent)}
.add.busy{opacity:.6; cursor:progress}
.row2{display:grid; grid-template-columns:1fr 200px; gap:14px; margin-top:14px}
@media (max-width:620px){ .row2{grid-template-columns:1fr} }
.saved{font-size:13px; color:var(--ok); margin-left:8px}
.status{font-size:12px; font-weight:800; border-radius:4px; padding:3px 8px; background:var(--panel2); color:var(--text); white-space:nowrap}
.status.done{background:var(--ok-soft); color:var(--ok)}
.status.cancel{background:var(--bad-soft); color:var(--bad)}
.toast{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 16px; border-radius:var(--r-sm); font-weight:700; z-index:9; max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
footer{color:var(--muted); font-size:12px; text-align:center; padding:20px}
.stctl{display:grid; gap:8px; justify-items:end}
.stctl select{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px; min-height:40px; font-weight:700; max-width:230px}
.stctl select:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.stconfirm{display:grid; gap:8px; width:min(100%, 420px); padding:12px; border:1px solid var(--accent); border-radius:var(--r-sm); background:var(--panel2); justify-items:stretch}
.stconfirm[hidden]{display:none}
.stconfirm label{font-size:14px; font-weight:700}
.stconfirm textarea{min-height:64px; font-weight:400}
.stconfirm .btns{display:flex; gap:8px; flex-wrap:wrap}
.clist{margin-bottom:18px}
.clist h2{font-size:20px; margin-bottom:6px}
.crow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow a{font-weight:800; text-decoration:none}
.crow a:hover{text-decoration:underline}
.crow .sub{display:block; color:var(--muted); font-size:13px}
@media (max-width:620px){ .crow{flex-direction:column} .stctl{justify-items:stretch; width:100%} .stctl select{max-width:none} }
.openlink{font-size:14px; margin-left:8px; font-family:var(--f-body); text-transform:none}

</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand" id="brand"></span><span id="hdr"></span></div></header>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<footer id="foot"></footer>
<script>
(function(){
'use strict';
const C = CONFIG, T = C.theme, F = C.fonts;
const r = document.documentElement.style;
[['--bg',T.bg],['--panel',T.panel],['--panel2',T.panel2],['--line',T.line],['--text',T.text],['--muted',T.muted],['--accent',T.accent],['--on-accent',T.onAccent],
 ['--highlight',T.highlight || T.accent],['--f-display',`'${F.display}', system-ui, sans-serif`],['--f-body',`'${F.body}', system-ui, -apple-system, 'Segoe UI', sans-serif`],
 ['--display-case', F.displayUpper ? 'uppercase' : 'none']].forEach(([k, v]) => r.setProperty(k, v));
const fam = (n, w) => 'family=' + n.replace(/ /g, '+') + (w ? ':wght@' + w : '');
const fl = document.createElement('link'); fl.rel = 'stylesheet';
fl.href = 'https://fonts.googleapis.com/css2?' + [fam(F.display, F.displayWeights)].concat(F.body !== F.display ? [fam(F.body, F.bodyWeights)] : []).join('&') + '&display=swap';
document.head.appendChild(fl);

const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const app = $('#app'), cap = s => s.charAt(0).toUpperCase() + s.slice(1);
document.title = 'Intake — ' + C.business;
$('#brand').innerHTML = esc(C.business) + '<small>Intake</small>';
$('#foot').textContent = C.build;
const money = n => n == null || isNaN(n) ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
const thumb = u => /res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u) ? u.replace('/image/upload/', '/image/upload/f_auto,q_auto,c_fill,w_200,h_266/') : u;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3000); }

let PIN = ''; try { PIN = sessionStorage.getItem('intake-pin') || ''; } catch (_) {}
async function api(body){
  if (!C.endpoint) throw new Error('This page isn’t connected yet — set endpoint in CONFIG.');
  const res = await fetch(C.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ type: 'intake', pin: PIN }, body)) });
  const d = await res.json();
  if (d && d.badPin) { PIN = ''; try { sessionStorage.removeItem('intake-pin'); } catch (_) {} showPin(d.error); throw new Error(d.error); }
  if (!d || !d.success) throw new Error((d && d.error) || 'Something went wrong — try again.');
  return d;
}

/* ---------- PIN ---------- */
function showPin(msg){
  $('#hdr').innerHTML = '';
  app.innerHTML = `<form class="pin" id="pinf"><h1>${esc(C.business)}</h1><p class="muted">Enter your intake PIN</p>` +
    `<input type="password" id="pin" inputmode="numeric" autocomplete="current-password" aria-label="PIN" required>` +
    `<button class="btn" type="submit">Open</button><p class="err" id="pinmsg">${esc(msg || '')}</p></form>`;
  $('#pin').focus();
  $('#pinf').addEventListener('submit', async e => {
    e.preventDefault(); PIN = $('#pin').value.trim(); $('#pinmsg').textContent = '';
    try { const d = await api({ action: 'list' }); try { sessionStorage.setItem('intake-pin', PIN); } catch (_) {} LIST = d; route(); }
    catch (err) { if ($('#pinmsg')) $('#pinmsg').textContent = err.message; }
  });
}

/* ---------- list ---------- */
let LIST = null, filt = 'open', q = '';
function isOpen(o){ return !(LIST.doneStages || []).includes(o.status); }
async function loadList(){
  app.innerHTML = '<p class="muted">Loading orders…</p>';
  try { LIST = await api({ action: 'list' }); renderList(); } catch (err) { if (PIN) app.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}
function renderList(){
  $('#hdr').innerHTML = `<button class="btn ghost small" id="refresh">Refresh</button>`;
  $('#refresh').onclick = loadList;
  const all = LIST.orders, shown = all.filter(o => (filt === 'all' || isOpen(o)) && (!q || (o.ref + ' ' + o.name).toLowerCase().includes(q)));
  app.innerHTML = `<div class="toolbar"><input type="search" id="q" placeholder="Search name or reference" value="${esc(q)}" aria-label="Search orders">` +
    `<div class="seg" role="group" aria-label="Show"><button data-f="open" aria-pressed="${filt === 'open'}">Open (${all.filter(isOpen).length})</button><button data-f="all" aria-pressed="${filt === 'all'}">All (${all.length})</button></div></div>` +
    `<div class="orders">${shown.length ? shown.map(o => {
      const n = o.count || 0;
      return `<button class="order" data-id="${esc(o.id)}"><span class="who">${esc(o.name || 'No name')}</span>` +
        `<span class="amt">${money(o.total)}<small>quote</small></span>` +
        `<span class="tags"><span class="tag">${esc(o.ref)}</span><span class="tag">${esc(when(o.at))}</span><span class="tag">${n} ${n === 1 ? esc(C.item) : esc(C.items)}</span>` +
        `<span class="tag">${esc(o.status)}</span>${o.photos.before >= n && n ? '<span class="tag ok">Before photos done</span>' : `<span class="tag">Before ${o.photos.before}/${n}</span>`}` +
        `${o.photos.after >= n && n ? '<span class="tag ok">After photos done</span>' : `<span class="tag">After ${o.photos.after}/${n}</span>`}${o.flagged ? '<span class="tag warn">Quote needs a look</span>' : ''}</span></button>`;
    }).join('') : `<div class="empty">${q ? 'No orders match that search.' : filt === 'open' ? 'No open orders.' : 'No orders yet.'}</div>`}</div>`;
  const qi = $('#q'); qi.addEventListener('input', () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; renderList(); const n2 = $('#q'); n2.focus(); n2.setSelectionRange(pos, pos); });
  $$('[data-f]').forEach(b => b.onclick = () => { filt = b.dataset.f; renderList(); });
  $$('.order').forEach(b => b.onclick = () => { location.hash = '#' + encodeURIComponent(b.dataset.id); });
}

/* ---------- order ---------- */
let O = null, STAGES = [], STAGE_EMAILS = {}, VIEW = { num: null };
async function loadOrder(id, num){
  VIEW.num = num == null ? null : String(num);
  app.innerHTML = '<p class="muted">Loading order…</p>';
  try { const d = await api({ action: 'order', id }); take(d); render(); }
  catch (err) { if (PIN) app.innerHTML = `<button class="btn ghost small back" onclick="location.hash=''">All orders</button><p class="err">${esc(err.message)}</p>`; }
}
function take(d){ O = d.order; STAGES = d.stages || STAGES; STAGE_EMAILS = d.stageEmails || STAGE_EMAILS; }
function render(){ if (VIEW.num != null && O.items.some(x => String(x.num) === VIEW.num)) renderCard(); else renderOrder(); }
function statusCtl(it){
  const st = it.status, opts = (STAGES.indexOf(st) === -1 ? [st] : []).concat(STAGES);
  return `<div class="stctl" data-stnum="${esc(it.num)}"><select data-st aria-label="Status for ${esc(cap(C.item))} ${esc(it.num)}">${opts.map(x => `<option${x === st ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>` +
    `<div class="stconfirm" hidden><label>Note to customer <span class="muted" style="font-weight:400">(optional, goes in the email)</span><textarea data-stnote>${esc(it.noteToCustomer)}</textarea></label>` +
    `<span class="muted" data-stmsg style="font-size:13px"></span><div class="btns"><button class="btn small" data-stgo>Update status</button><button class="btn ghost small" data-stcancel>Cancel</button></div></div></div>`;
}
function wireStatus(root){
  $$('.stctl', root).forEach(ctl => {
    const it = O.items.find(x => String(x.num) === ctl.dataset.stnum), sel = $('[data-st]', ctl), box = $('.stconfirm', ctl), msg = $('[data-stmsg]', ctl);
    sel.addEventListener('change', () => {
      if (sel.value === it.status) { box.hidden = true; return; }
      box.hidden = false;
      msg.textContent = STAGE_EMAILS[sel.value] ? 'The customer gets an email about this stage.' : 'No email is sent for this stage.';
    });
    $('[data-stcancel]', ctl).onclick = () => { sel.value = it.status; box.hidden = true; };
    $('[data-stgo]', ctl).onclick = async e => {
      const b = e.currentTarget; b.disabled = true; b.textContent = 'Updating…';
      try { const d = await api({ action: 'status', id: O.id, num: it.num, status: sel.value, note: $('[data-stnote]', ctl).value });
        take(d); const y = scrollY; render(); scrollTo(0, y);
        toast(cap(C.item) + ' ' + it.num + ': ' + d.statusResult.status + (d.statusResult.emailed ? ' — customer emailed' : '')); }
      catch (err) { toast(err.message); b.disabled = false; b.textContent = 'Update status'; }
    };
  });
}
function renderCard(){
  const it = O.items.find(x => String(x.num) === VIEW.num), i = O.items.indexOf(it);
  const prev = O.items[i - 1], next = O.items[i + 1];
  $('#hdr').innerHTML = `<button class="btn ghost small" id="refresh">Refresh</button>`;
  $('#refresh').onclick = () => loadOrder(O.id, VIEW.num);
  app.innerHTML = `<div class="toolbar"><button class="btn ghost small" id="toorder">Back to order</button>` +
    (prev ? `<button class="btn ghost small" data-go="${esc(prev.num)}">Previous ${esc(C.item)}</button>` : '') +
    (next ? `<button class="btn ghost small" data-go="${esc(next.num)}">Next ${esc(C.item)}</button>` : '') + `</div>` +
    `<p class="muted" style="margin:0 0 10px">${esc(O.name || 'No name')}, ${esc(O.ref)}, ${esc(cap(C.item))} ${i + 1} of ${O.items.length}</p>` + cardHtml(it, true);
  $('#toorder').onclick = () => { location.hash = '#' + encodeURIComponent(O.id); };
  $$('[data-go]').forEach(b => b.onclick = () => { location.hash = '#' + encodeURIComponent(O.id) + '/' + encodeURIComponent(b.dataset.go); });
  wireCard(it); wireStatus(app);
}
function renderOrder(){
  $('#hdr').innerHTML = `<button class="btn ghost small" id="refresh">Refresh</button>`;
  $('#refresh').onclick = () => loadOrder(O.id);
  const qt = O.quote || { lines: [], subtotal: 0, referral: 0, yours: 0, total: 0, notes: [] };
  app.innerHTML =
    `<button class="btn ghost small back" id="back">All orders</button>` +
    `<div class="ohead"><div><h1>${esc(O.name || 'No name')}</h1><div class="contact">` +
      `<span class="muted">${esc(O.ref)}, ${esc(when(O.at))}</span>` +
      (O.email ? `<a href="mailto:${esc(O.email)}">${esc(O.email)}</a>` : '') + (O.phone ? `<a href="tel:${esc(O.phone.replace(/[^+\d]/g, ''))}">${esc(O.phone)}</a>` : '') +
      `<span>${esc(O.delivery)}${O.insured === 'Yes' ? ', insured return' : ''}</span>${O.address ? `<span class="muted">${esc(O.address)}</span>` : ''}</div></div>` +
      `<span class="status">${esc(O.status)}</span></div>` +
    `<section class="panel quote" aria-label="Quote"><h2>Quote</h2>` +
      qt.lines.map(l => `<div class="qline"><span>${esc(cap(C.item))} ${esc(l.num)}${l.name ? ': ' + esc(l.name) : ''}<span class="bd">${esc(l.breakdown)}</span></span><b>${l.cancelled ? 'Not charged' : l.quote == null ? 'Needs a price' : money(l.quote)}</b></div>`).join('') +
      `<div class="qline"><span>Subtotal</span><b>${money(qt.subtotal)}</b></div>` +
      (qt.referral ? `<div class="qline"><span>Referral ${esc(qt.referralCode)}</span><b>−${money(qt.referral)}</b></div>` : '') +
      (qt.yours ? `<div class="qline"><span>Your discount (${esc(qt.discountLabel)})</span><b>−${money(qt.yours)}</b></div>` : '') +
      `<div class="qtotal"><span class="muted">Total to charge</span><span class="big">${money(qt.total)}</span></div>` +
      `<div class="disc"><label for="disc" class="muted">Your discount</label><input type="text" id="disc" placeholder="10% or 15" value="${esc(qt.discount || '')}">` +
      `<button class="btn small" id="discgo">Apply</button>${qt.discount ? '<button class="btn ghost small" id="discclear">Remove</button>' : ''}</div>` +
      (qt.notes.length ? `<ul class="qnotes">${qt.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '') +
    `</section>` +
    `<section class="panel clist" aria-label="${esc(cap(C.items))}"><h2>${esc(cap(C.items))}</h2>` +
      O.items.map(it => `<div class="crow"><span><a href="#${encodeURIComponent(O.id)}/${encodeURIComponent(it.num)}">${esc(cap(C.item))} ${esc(it.num)}: ${esc(it.name || 'Unnamed')}</a>` +
        `<span class="sub">${esc(it.service || '')}</span></span>${statusCtl(it)}</div>`).join('') + `</section>` +
    O.items.map(it => cardHtml(it, false)).join('');
  $('#back').onclick = () => { location.hash = ''; };
  $('#discgo').onclick = () => save({ action: 'discount', id: O.id, value: $('#disc').value.trim() }, 'Discount applied');
  if ($('#discclear')) $('#discclear').onclick = () => save({ action: 'discount', id: O.id, value: '' }, 'Discount removed');
  $('#disc').addEventListener('keydown', e => { if (e.key === 'Enter') $('#discgo').click(); });
  O.items.forEach(wireCard);
  wireStatus(app);
}
function cardHtml(it, single){
  const cust = [['Front', it.front], ['Back', it.back]].filter(x => x[1]).concat(it.details.map((u, i) => ['Detail ' + (i + 1), u]));
  const strip = (kind, list) => `<div class="strip">${list.map(u => `<span class="thumb"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(thumb(u))}" alt="${kind} photo" loading="lazy"></a><button class="x" data-rm="${kind}" data-url="${esc(u)}" aria-label="Remove ${kind} photo">×</button></span>`).join('')}` +
    `<label class="add" data-add="${kind}">Add ${kind} photos<input type="file" accept="image/*,.heic,.heif" multiple hidden></label></div>`;
  return `<section class="panel card" data-num="${esc(it.num)}" aria-label="${esc(cap(C.item))} ${esc(it.num)}"><div class="chead"><h3>${esc(cap(C.item))} ${esc(it.num)}: ${esc(it.name || 'Unnamed')}${single ? '' : `<a class="openlink" href="#${encodeURIComponent(O.id)}/${encodeURIComponent(it.num)}">Open on its own</a>`}</h3>${statusCtl(it)}</div>` +
    `<dl class="facts"><dt>Service</dt><dd>${esc(it.service || '—')}</dd>${it.value ? `<dt>Value</dt><dd>${esc(it.value)}</dd>` : ''}${it.notes ? `<dt>Customer notes</dt><dd>${esc(it.notes)}</dd>` : ''}` +
    `<dt>Quote</dt><dd><b>${/cancel/i.test(it.status) ? 'Not charged' : it.quote == null ? 'Needs a price' : money(it.quote)}</b> <span class="muted">${esc(it.breakdown)}</span></dd></dl>` +
    (cust.length ? `<div class="ph"><b>Customer photos</b><div class="strip">${cust.map(([l, u]) => `<span class="thumb"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(thumb(u))}" alt="${esc(l)}" loading="lazy"></a><span>${esc(l)}</span></span>`).join('')}</div></div>` : '') +
    `<div class="ph"><b>Before photos</b>${strip('before', it.before)}</div>` +
    `<div class="ph"><b>After photos</b>${strip('after', it.after)}</div>` +
    `<div class="row2"><label><b style="font-size:14px">Intake notes</b> <span class="saved" data-saved hidden>Saved</span><textarea data-notes placeholder="Condition on arrival, what you found, what you did">${esc(it.intakeNotes)}</textarea></label>` +
    `<label><b style="font-size:14px">Price override</b><input type="text" data-ov inputmode="decimal" placeholder="Use quote" value="${esc(it.override)}"><span class="muted" style="font-size:13px">Your price for this ${esc(C.item)}. Blank uses the quote.</span></label></div></section>`;
}
function wireCard(it){
  const el = $(`.card[data-num="${CSS.escape(String(it.num))}"]`);
  $$('.add', el).forEach(lab => $('input', lab).addEventListener('change', async e => {
    const files = Array.from(e.target.files); e.target.value = ''; if (!files.length) return;
    lab.classList.add('busy'); lab.firstChild.textContent = 'Uploading…';
    try {
      for (const f of files) { const url = await upload(f); await api({ action: 'photo', id: O.id, num: it.num, kind: lab.dataset.add, url }); }
      toast(files.length > 1 ? files.length + ' photos added' : 'Photo added'); await loadOrder(O.id);
    } catch (err) { toast(err.message); lab.classList.remove('busy'); lab.firstChild.textContent = 'Add ' + lab.dataset.add + ' photos'; }
  }));
  $$('[data-rm]', el).forEach(b => b.onclick = () => { if (b.dataset.armed) return save({ action: 'removePhoto', id: O.id, num: it.num, kind: b.dataset.rm, url: b.dataset.url }, 'Photo removed');
    b.dataset.armed = '1'; b.textContent = '?'; b.setAttribute('aria-label', 'Tap again to remove'); setTimeout(() => { b.dataset.armed = ''; b.textContent = '×'; }, 3000); });
  const ta = $('[data-notes]', el), saved = $('[data-saved]', el); let last = ta.value;
  ta.addEventListener('blur', async () => { if (ta.value === last) return; try { await api({ action: 'note', id: O.id, num: it.num, text: ta.value }); last = ta.value; saved.hidden = false; setTimeout(() => { saved.hidden = true; }, 2000); } catch (err) { toast(err.message); } });
  const ov = $('[data-ov]', el); let lastOv = ov.value;
  const setOv = () => { if (ov.value.trim() === lastOv.trim()) return; lastOv = ov.value; save({ action: 'override', id: O.id, num: it.num, value: ov.value.trim() }, ov.value.trim() ? 'Price set' : 'Back to the quote'); };
  ov.addEventListener('change', setOv); ov.addEventListener('keydown', e => { if (e.key === 'Enter') ov.blur(); });
}
async function save(body, done){
  try { const d = await api(body); take(d); const y = scrollY; render(); scrollTo(0, y); toast(done); }
  catch (err) { toast(err.message); }
}

/* ---------- uploads ---------- */
function shrink(file){
  return new Promise(resolve => {
    if (!/^image\/jpeg$/.test(file.type) || file.size < 1.5e6) return resolve(file);
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 2400 / Math.max(img.width, img.height)); if (s === 1) { URL.revokeObjectURL(u); return resolve(file); }
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
      cv.toBlob(b => resolve(b ? new File([b], 'photo.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.9); };
    img.onerror = () => { URL.revokeObjectURL(u); resolve(file); };
    img.src = u;
  });
}
async function upload(file){
  if (!C.cloudinaryCloud || !C.cloudinaryPreset) throw new Error('Photo uploads aren’t set up — add Cloudinary to CONFIG.');
  const fd = new FormData(); fd.append('file', await shrink(file)); fd.append('upload_preset', C.cloudinaryPreset); fd.append('folder', 'intake/' + O.ref);
  const res = await fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(C.cloudinaryCloud) + '/image/upload', { method: 'POST', body: fd });
  const d = await res.json();
  if (!d.secure_url) throw new Error((d.error && d.error.message) || 'Upload failed');
  return d.secure_url;
}

/* ---------- routing ---------- */
function route(){
  if (!PIN) return showPin();
  const [id, num] = location.hash.slice(1).split('/').map(decodeURIComponent);
  if (id && O && O.id === id && num !== undefined && O.items.some(x => String(x.num) === num)) { VIEW.num = num; window.scrollTo(0, 0); render(); }
  else if (id && O && O.id === id && num === undefined && VIEW.num != null) { VIEW.num = null; render(); }
  else if (id) loadOrder(id, num); else if (LIST) renderList(); else loadList();
}
window.addEventListener('hashchange', () => { if (!location.hash) LIST = null; route(); });
route();
})();
</script>
