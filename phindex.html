    imageAlt: 'Alfonso, founder of PH Restoration Labs, in a cowboy hat and sunglasses',
    // Alfonso's own text.
    paragraphs: [
      { lead: 'PH Restoration Lab was built from a genuine love for the hobby.' },
      'I’m Alfonso, owner of PH Collectibles HTX and founder of PH Restoration Lab. What started with collecting Pokémon and being part of the Houston TCG community grew into buying, selling, vending at card shows, and eventually learning how to properly care for and restore the cards we collect.',
      'The restoration side started with my own collection. I wanted to understand what could actually be done for cards with surface issues, dents, creases, warping, dirt, and years of wear. That curiosity turned into countless hours of researching, testing techniques, improving equipment, and developing a process I could trust enough to use on cards that matter to me.',
      'Eventually, I realized other collectors were looking for the same thing.',
      { h: 'What is PH Restoration Lab?' },
      'PH Restoration Lab is about giving cards another chance.',
      'We provide professional card cleaning, polishing, flattening, crease and surface repair, controlled humidity treatment, heat pressing, and other restoration services depending on the condition of the card. Every card is evaluated individually because no two cards—and no two types of damage—are exactly the same.',
      'This isn’t about promising perfection or guaranteeing a grade. It’s about carefully improving a card’s condition while respecting the collectible and doing only what makes sense for that particular card.',
      'My process is simple:',
      { steps: ['Check it', 'Work it', 'Restore it', 'Results'] },
      'Every card is inspected, a restoration plan is determined, the work is performed carefully, and the results speak for themselves.',
      { h: 'Built for collectors' },
      'Whether it’s a childhood card you’ve owned for 20 years, a vintage Pokémon card you just picked up at a show, a card you’re considering submitting for grading, or simply a piece you want looking better in your personal collection, PH Restoration Lab is here to help.',
      'I want customers to know exactly what they’re sending me and what they can realistically expect back. Transparency matters. If I don’t believe a certain repair should be attempted, I’ll tell you. If damage can’t safely be removed, I’ll tell you that too.',
      'These aren’t just pieces of cardboard. Some cards have memories attached to them. Some are investments. Some are grails people searched years to find.',
      'I treat every card like I would want someone to treat one of mine.'
    ],
    closing: 'Houston-born. Collector-first. Restored the PH Way.'
  },

/* ---------- Apply theme before the page paints (no edits needed) ---------- */
(function(){
  const t = CONFIG.theme, c = t.colors, f = t.fonts, r = document.documentElement.style;
  const map = { bg:'--bg', panel:'--panel', panel2:'--panel-2', line:'--line', text:'--text', muted:'--muted',
    primary:'--primary', primaryLight:'--primary-light', accent:'--accent', highlight:'--highlight', highlight2:'--highlight-2',
    onHighlight:'--on-highlight', onAccent:'--on-accent', success:'--success', danger:'--danger', starOff:'--star-off' };
  Object.keys(map).forEach(k => { if(c[k]) r.setProperty(map[k], c[k]); });
  r.setProperty('--radius', t.radius); r.setProperty('--maxw', t.maxWidth);
  if(t.variant) document.documentElement.classList.add('v-' + t.variant);
  const glow = t.glow == null ? 1 : t.glow;
  r.setProperty('--glow-a', `color-mix(in srgb, ${c.primary} ${Math.round(35 * glow)}%, transparent)`);
  r.setProperty('--glow-b', `color-mix(in srgb, ${c.accent} ${Math.round(12 * glow)}%, transparent)`);
  if(CONFIG.hero && CONFIG.hero.imageMaxWidth) r.setProperty('--hero-maxw', CONFIG.hero.imageMaxWidth);
  r.setProperty('--font-display', `'${f.display}', ${f.displayFallback || 'system-ui, sans-serif'}`);
  r.setProperty('--font-body', `'${f.body}', system-ui, -apple-system, 'Segoe UI', sans-serif`);
  r.setProperty('--display-weight', f.displayWeight || 400);
  r.setProperty('--ds', f.displayScale || 1);
  r.setProperty('--display-lh', f.displayLineHeight || 1.35);
  r.setProperty('--display-case', f.displayUppercase ? 'uppercase' : 'none');
  r.setProperty('--display-style', f.displayItalic ? 'italic' : 'normal');
  const tool = CONFIG.tool || {};
  if(tool.frontFrame) r.setProperty('--tool-frame-front', tool.frontFrame);
  if(tool.backFrame)  r.setProperty('--tool-frame-back', tool.backFrame);
  if(tool.frontImage) r.setProperty('--tool-img-front', `url("${tool.frontImage}")`);
  if(tool.backImage)  r.setProperty('--tool-img-back', `url("${tool.backImage}")`);

  const fam = (name, w, ital) => 'family=' + name.trim().replace(/ /g, '+') +
    (ital ? (w ? ':ital,wght@' + w.split(';').map(x => '1,' + x).join(';') : ':ital@1') : (w ? ':wght@' + w : ''));
  const href = 'https://fonts.googleapis.com/css2?' + [fam(f.display, f.displayWeights, f.displayItalic), fam(f.body, f.bodyWeights)].join('&') + '&display=swap';
  ['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].forEach((u, i) => {
    const l = document.createElement('link'); l.rel = 'preconnect'; l.href = u; if(i) l.crossOrigin = ''; document.head.appendChild(l);
  });
  const fl = document.createElement('link'); fl.rel = 'stylesheet'; fl.href = href; document.head.appendChild(fl);

  const w = CONFIG.words, cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fill = s => String(s || '').replace(/\{item\}/g, w.item).replace(/\{items\}/g, w.items).replace(/\{business\}/g, CONFIG.brand.name);
  document.title = fill(CONFIG.meta.title).replace(/&amp;/g, '&');
  const md = document.createElement('meta'); md.name = 'description'; md.content = fill(CONFIG.meta.description); document.head.appendChild(md);
  let fav = CONFIG.brand.favicon;
  if(!fav){
    const letter = (CONFIG.brand.name.trim()[0] || '?').toUpperCase();
    fav = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${c.primary}"/><text x="32" y="44" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="${c.highlight2 || '#fff'}">${letter}</text></svg>`);
  }
  const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = fav; document.head.appendChild(ic);
})();

<style>

  }
  .section-head p{font-size:14px; color:var(--muted); margin:0; line-height:1.6;}
  .divider{height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent); margin:44px 0 0;}

  /* Pricing ladder */
  .ladder{position:relative; margin-top:20px;}
  .ladder-group-label{
    display:inline-block;
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(13px * var(--ds)); letter-spacing:0.03em;
    color:var(--on-accent); background:linear-gradient(135deg, var(--accent), var(--primary-light));
    padding:8px 14px; border-radius:5px;
    margin:28px 0 16px;
  }
  .ladder-group-label:first-child{margin-top:0;}
  .tier{
    position:relative;
    display:flex; gap:14px;
    padding:16px 16px 16px 0;
    border-left:2px solid var(--line);
    margin-left:22px;
  }
  .tier:last-child{border-left:2px solid transparent;}
  .tier-price{
    position:absolute; left:-24px; top:12px;
    width:48px; height:48px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--primary);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(15px * var(--ds)); color:var(--accent);
    flex-shrink:0;
  }
  .tier-body{padding-left:36px;}
  .tier-body h3{margin:0 0 6px; font-size:14px; color:var(--text);}
  .tier-body p{margin:0; font-size:13px; color:var(--muted); line-height:1.6;}

  /* Surcharge table */
  .surcharge-table{
    margin-top:18px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  .surcharge-row{
    display:flex; justify-content:space-between; padding:11px 14px;
    font-size:13px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .surcharge-row:last-child{border-bottom:none;}
  .surcharge-row.surcharge-header{
    background:var(--panel-2); font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted);
  }
  .surcharge-row.surcharge-header .fee{color:var(--muted);}
  .surcharge-row .val{color:var(--muted);}
  .surcharge-row .fee{color:var(--highlight-2); font-weight:600;}
  .surcharge-note{font-size:12px; color:var(--muted); margin-top:12px; line-height:1.6;}

  .price-notice{
    display:flex; gap:12px; align-items:flex-start;
    background:color-mix(in srgb, var(--highlight) 8%, transparent); border:1px solid var(--highlight); border-radius:var(--radius);
    padding:14px 16px; margin:0 0 26px; font-size:13px; line-height:1.6; color:var(--text);
  }
  .price-notice .pn-tag{
    flex-shrink:0; font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(11px * var(--ds)); letter-spacing:.04em;
    background:var(--highlight); color:var(--on-highlight); padding:6px 8px; border-radius:4px; margin-top:2px;
  }
  .price-notice b{color:var(--highlight-2);}
  .price-notice ul{margin:6px 0 0; padding-left:18px; color:var(--muted);}
  .price-notice ul b{color:var(--text);}
  .bulk-table{margin:4px 0 0 58px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; max-width:420px;}
  .bulk-table .surcharge-row .fee{color:var(--accent);}
  @media (max-width:420px){ .bulk-table{margin-left:22px;} }
  .tier-body .tier-sub{display:block; margin-top:6px; font-size:12px; color:var(--accent);}
  .addon-check{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text); cursor:pointer; margin-top:10px;}
  .addon-check input{width:17px; height:17px; accent-color:var(--accent); flex-shrink:0; cursor:pointer;}
  .calc-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-top:16px;
  }
  .calc-result{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  }
  .calc-line{
    display:flex; justify-content:space-between; font-size:13px; color:var(--muted);
    padding:5px 0;
  }
  .calc-line span:last-child{color:var(--text); font-weight:600;}
  .calc-line.calc-total{
    margin-top:6px; padding-top:10px; border-top:1px solid var(--line);
    font-size:15px; color:var(--text); font-weight:700;
  }
  .calc-line.calc-total span:last-child{
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(19px * var(--ds)); color:var(--highlight-2);
  }
  .calc-hint{font-size:11px; color:var(--muted); margin-top:12px; line-height:1.6; text-align:center;}

  .card-panel > summary{
    cursor:pointer; font-size:14px; color:var(--text); text-transform:uppercase;
    font-weight:600; letter-spacing:0.02em; list-style:none;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .card-panel > summary::-webkit-details-marker{display:none;}
  .card-panel > summary::after{
    content:'+'; color:var(--accent); font-size:20px; line-height:1; flex-shrink:0; font-weight:400;
  }
  .card-panel[open] > summary::after{content:'\2212';}
  .card-panel[open] > summary{
    margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .card-panel > summary:hover{color:var(--accent);}

  /* ===== Centering calculator promo ===== */
  .cc-promo{
    display:flex; align-items:center; gap:14px; text-decoration:none;
    margin-top:22px; padding:15px 16px; border-radius:12px;
    background:linear-gradient(120deg, color-mix(in srgb, var(--primary) 30%, transparent), color-mix(in srgb, var(--accent) 14%, transparent));
    border:1.5px solid var(--accent); position:relative; overflow:hidden;
    animation:cc-glow 2.8s ease-in-out infinite;
  }
  @keyframes cc-glow{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 32%, transparent);}
    50%{box-shadow:0 0 16px 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  }
  .cc-promo::after{
    content:''; position:absolute; top:0; bottom:0; width:38%;
    background:linear-gradient(100deg, transparent, color-mix(in srgb, var(--text) 13%, transparent), transparent);
    animation:cc-sheen 3.6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes cc-sheen{
    0%{left:-45%;} 55%{left:115%;} 100%{left:115%;}
  }
  .cc-promo-icon{flex-shrink:0;}
  .cc-mini-card{
    display:block; width:30px; height:42px; border-radius:4px;
    background:linear-gradient(160deg,#f2e9c9,#e0d29c); position:relative;
    box-shadow:0 3px 9px -3px rgba(0,0,0,0.8);
  }
  .cc-mini-img{
    position:absolute; border-radius:1px;
    background:linear-gradient(150deg, var(--primary-light), var(--primary) 60%, var(--panel-2));
    left:12%; right:5%; top:9%; bottom:13%;
    animation:cc-shift 3.2s ease-in-out infinite;
  }
  @keyframes cc-shift{
    0%,100%{left:12%; right:5%;}
    50%{left:5%; right:12%;}
  }
  .cc-promo-text{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1;}
  .cc-promo-title{
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(13px * var(--ds)); line-height:var(--display-lh);
    color:var(--accent); letter-spacing:0.02em;
  }
  .cc-promo-sub{font-size:12px; color:var(--text); opacity:0.85; line-height:1.45;}
  .cc-promo-arrow{color:var(--accent); font-size:20px; flex-shrink:0;}
  @media (prefers-reduced-motion:reduce){
    .cc-promo, .cc-promo::after, .cc-mini-img{animation:none;}
  }

  /* ===== Reviews ===== */
  /* Scrolling review ticker (lives in the sticky header) */
  .review-ticker{
    display:flex; align-items:center; text-decoration:none;
    border-top:1px solid var(--line); background:color-mix(in srgb, var(--panel) 92%, transparent);
    height:30px; overflow:hidden;
  }
  .rt-label{
    flex-shrink:0; align-self:stretch; display:flex; align-items:center;
    padding:0 10px; font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(10px * var(--ds)); letter-spacing:0.08em;
    color:var(--bg); background:linear-gradient(135deg, var(--accent), var(--primary-light));
  }
  .rt-viewport{
    flex:1; min-width:0; overflow:hidden; position:relative;
    -webkit-mask-image:linear-gradient(to right, transparent, #000 18px, #000 calc(100% - 18px), transparent);
            mask-image:linear-gradient(to right, transparent, #000 18px, #000 calc(100% - 18px), transparent);
  }
  .rt-track{
    display:inline-flex; white-space:nowrap; will-change:transform;
    animation:rt-scroll var(--rt-dur, 40s) linear infinite;
  }
  .review-ticker:hover .rt-track,
  .review-ticker:focus-visible .rt-track{animation-play-state:paused;}
  @keyframes rt-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .rt-item{display:inline-flex; align-items:center; gap:7px; padding:0 22px; font-size:12px; color:var(--text);}
  .rt-item + .rt-item{border-left:1px solid var(--line);}
  .rt-stars{color:var(--highlight-2); letter-spacing:1px; font-size:11px;}
  .rt-text{font-style:italic;}
  .rt-who{color:var(--muted);}
  @media (prefers-reduced-motion:reduce){
    .rt-track{animation:none;}
    .rt-viewport{overflow-x:auto;}
  }

  .rv-summary{
    display:flex; align-items:center; gap:12px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px;
  }
  .rv-avg{font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(28px * var(--ds)); color:var(--highlight-2);}
  .rv-sum-meta{font-size:12px; color:var(--muted); line-height:1.5;}
  .rv-sum-stars{color:var(--highlight-2); font-size:13px; letter-spacing:1px;}

  .rv-list{display:flex; flex-direction:column; gap:10px;}
  .rv-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;
  }
  .rv-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .rv-who{font-size:13px; font-weight:700; color:var(--text);}
  .rv-card-stars{color:var(--highlight-2); font-size:12px; letter-spacing:1px;}
  .rv-item-card{font-size:11px; color:var(--accent); margin-top:3px;}
  .rv-text{font-size:13px; color:var(--muted); line-height:1.65; margin-top:8px;}
  .rv-empty{
    font-size:12px; color:var(--muted); text-align:center; padding:18px;
    border:1px dashed var(--line); border-radius:10px;
  }

  .rv-form-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-top:16px;
  }
  .rv-form-wrap > summary{
    cursor:pointer; font-size:13px; color:var(--accent); font-weight:600; list-style:none;
    display:flex; justify-content:space-between; align-items:center;
  }
  .rv-form-wrap > summary::-webkit-details-marker{display:none;}
  .rv-form-wrap > summary::after{content:'+'; font-size:20px; line-height:1; font-weight:400;}
  .rv-form-wrap[open] > summary::after{content:'\2212';}
  .rv-form-wrap[open] > summary{margin-bottom:16px;}
  .rv-rating{display:flex; gap:4px;}
  .rv-star{
    background:none; border:none; cursor:pointer; font-size:26px; line-height:1;
    color:var(--star-off); padding:0 2px; transition:color .15s ease;
  }
  .rv-star.on{color:var(--highlight-2);}
  .rv-star:hover{color:var(--highlight-2);}

  /* ===== Centering calculator ===== */
  .cent-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-top:16px;
  }
  .cent-wrap > summary{
    cursor:pointer; font-size:14px; color:var(--text); text-transform:uppercase;
    font-weight:600; letter-spacing:0.02em; list-style:none;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .cent-wrap > summary::-webkit-details-marker{display:none;}
  .cent-wrap > summary::after{
    content:'+'; color:var(--accent); font-size:20px; line-height:1; flex-shrink:0; font-weight:400;
  }
  .cent-wrap[open] > summary::after{content:'\2212';}
  .cent-wrap[open] > summary{margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .cent-wrap > summary:hover{color:var(--accent);}
  .cent-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .cent-reset{
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
    font-size:11px; padding:8px 12px; border-radius:6px; transition:border-color .18s ease, color .18s ease;
  }
  .cent-reset:hover{border-color:var(--highlight); color:var(--highlight);}
  .cent-hint{font-size:11px; color:var(--muted); line-height:1.6; margin-bottom:20px;}

  .cent-faces{display:grid; grid-template-columns:1fr; gap:26px;}
  @media (min-width:620px){ .cent-faces{grid-template-columns:1fr 1fr; gap:22px;} }

  .cent-face{min-width:0;}
  .cent-face-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .cent-side-label{font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(13px * var(--ds)); color:var(--accent); letter-spacing:0.05em;}
  .cent-optional{font-family:var(--font-body); font-size:10px; color:var(--muted); letter-spacing:0; text-transform:uppercase;}
  .cent-face-status{font-size:10px; color:var(--muted); letter-spacing:0.03em;}
  .cent-face-status.ok{color:var(--accent);}

  .centering-diagram{
    display:grid; grid-template-columns:48px minmax(0,1fr) 48px;
    grid-template-rows:auto auto auto; gap:6px;
    align-items:center; justify-items:center;
    max-width:290px; margin:0 auto;
  }
  .cent-input{display:flex; flex-direction:column; align-items:center; gap:3px; width:100%;}
  .cent-input label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
  .cent-input input{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); border-radius:7px; padding:9px 4px; font-size:14px; text-align:center;
    font-family:var(--font-body); -moz-appearance:textfield;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .cent-input input::-webkit-outer-spin-button,
  .cent-input input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .cent-input input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);}
  .cent-input input.filled{border-color:var(--primary);}
  .cent-top{grid-column:2; grid-row:1;}
  .cent-left{grid-column:1; grid-row:2;}
  .cent-right{grid-column:3; grid-row:2;}
  .cent-bottom{grid-column:2; grid-row:3;}

  .cent-card-visual{grid-column:2; grid-row:2; width:100%; display:flex; justify-content:center;}
  .cent-card-frame{
    position:relative; width:100%; max-width:150px; aspect-ratio:2.5/3.5;
    border-radius:9px; background:var(--tool-frame-front);
    box-shadow:0 8px 24px -10px rgba(0,0,0,0.8); overflow:hidden;
  }
  .cent-card-frame.back-frame{background:var(--tool-frame-back);}
  .cent-card-img{
    position:absolute; border-radius:2px;
    background-image:var(--tool-img-front, linear-gradient(150deg, var(--primary-light), var(--primary)));
    background-size:100% 100%; background-position:center;
    left:3.95%; right:3.95%; top:3.1%; bottom:3.1%;
    transition:left .25s ease, right .25s ease, top .25s ease, bottom .25s ease;
  }
  .cent-card-img.back{left:4.95%; right:4.95%; top:3.8%; bottom:3.8%;}
  .cent-card-img.back{background-image:var(--tool-img-back, linear-gradient(150deg, var(--primary), var(--panel-2)));}
  .cent-crosshair-v, .cent-crosshair-h{position:absolute; background:color-mix(in srgb, var(--text) 35%, transparent); pointer-events:none;}
  .cent-crosshair-v{left:50%; top:0; bottom:0; width:1px; transform:translateX(-0.5px);}
  .cent-crosshair-h{top:50%; left:0; right:0; height:1px; transform:translateY(-0.5px);}

  .cent-axis-readout{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .cent-axis-row{display:flex; align-items:center; gap:8px; font-size:11px;}
  .cent-axis-row .axis-name{color:var(--muted); width:52px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.04em; font-size:10px;}
  .cent-axis-bar{flex:1; height:7px; border-radius:99px; background:var(--panel-2); position:relative; overflow:hidden; border:1px solid var(--line);}
  .cent-axis-fill{position:absolute; top:0; bottom:0; left:0; border-radius:99px; transition:width .25s ease, background .25s ease;}
  .cent-axis-val{width:82px; text-align:right; color:var(--text); font-weight:600; flex-shrink:0; font-variant-numeric:tabular-nums;}

  .cent-empty{
    font-size:12px; color:var(--muted); text-align:center; padding:18px 12px; line-height:1.6;
    border:1px dashed var(--line); border-radius:10px; margin-top:22px;
  }

  .cent-output{margin-top:24px; padding-top:20px; border-top:1px solid var(--line);}
  .cent-summary{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;
  }
  .cent-stat{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:14px 12px; text-align:center;
  }
  .cent-stat .stat-label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em;}
  .cent-stat .stat-val{
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(19px * var(--ds)); margin-top:8px; line-height:1.4;
  }
  .cent-grades-label{
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(12px * var(--ds)); color:var(--muted);
    letter-spacing:0.06em; text-transform:uppercase; margin-bottom:12px;
  }
  .cent-grades{display:grid; grid-template-columns:1fr; gap:10px;}
  @media (min-width:520px){ .cent-grades{grid-template-columns:1fr 1fr;} }
  .grade-card{
    background:var(--panel-2); border:1.5px solid var(--line); border-radius:10px;
    padding:14px; display:flex; align-items:center; gap:12px;
    transition:border-color .2s ease;
  }
  .grade-card.tier-top{border-color:var(--highlight-2);}
  .grade-card.tier-high{border-color:var(--accent);}
  .grade-card.tier-mid{border-color:var(--primary-light);}
  .grade-card.tier-low{border-color:var(--line);}
  .grade-card .grader{
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(13px * var(--ds)); color:var(--muted);
    width:46px; flex-shrink:0; letter-spacing:0.02em;
  }
  .grade-card .grade-body{min-width:0; flex:1;}
  .grade-card .grade-val{font-size:15px; font-weight:700; color:var(--text); line-height:1.3;}
  .grade-card.tier-top .grade-val{color:var(--highlight-2);}
  .grade-card.tier-high .grade-val{color:var(--accent);}
  .grade-card .grade-note{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.5;}

  /* BGS 10 Black Label treatment */
  .grade-card.black-label{
    position:relative; overflow:hidden;
    background:linear-gradient(150deg,#0a0a0c,#141418 55%,#0a0a0c);
    border:2px solid #d9b44a;
    box-shadow:0 0 0 1px rgba(217,180,74,0.25), 0 0 18px -2px rgba(217,180,74,0.45);
    animation:bl-pulse 2.6s ease-in-out infinite;
    padding-top:20px;
  }
  @keyframes bl-pulse{
    0%,100%{box-shadow:0 0 0 1px rgba(217,180,74,0.25), 0 0 14px -4px rgba(217,180,74,0.35);}
    50%    {box-shadow:0 0 0 1px rgba(217,180,74,0.45), 0 0 26px 0 rgba(217,180,74,0.60);}
  }
  .grade-card.black-label::after{
    content:''; position:absolute; top:0; bottom:0; width:32%; pointer-events:none;
    background:linear-gradient(100deg, transparent, rgba(255,231,163,0.16), transparent);
    animation:bl-sheen 3.4s ease-in-out infinite;
  }
  @keyframes bl-sheen{ 0%{left:-40%;} 55%{left:112%;} 100%{left:112%;} }
  .grade-card.black-label .bl-ribbon{
    position:absolute; top:0; left:0; right:0; text-align:center;
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(10px * var(--ds)); letter-spacing:0.18em;
    color:#0a0a0c; background:linear-gradient(90deg,#c39b38,#f2d477 50%,#c39b38);
    padding:4px 0 3px;
  }
  .grade-card.black-label .grader{color:#d9b44a;}
  .grade-card.black-label .grade-val{
    color:#f6e3a8; text-shadow:0 0 10px rgba(217,180,74,0.5);
  }
  .grade-card.black-label .bl-pristine{
    font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(11px * var(--ds)); letter-spacing:0.08em;
    color:#d9b44a; margin-left:4px; vertical-align:1px;
  }
  .grade-card.black-label .bl-prov-tag{font-size:11px; color:#8a7a52; font-weight:400;}
  .grade-card.black-label .grade-note{color:#9a8c6a;}
  .grade-card.black-label.bl-provisional{
    border-color:#8a7332;
  }
  @media (prefers-reduced-motion:reduce){
    .grade-card.black-label, .grade-card.black-label::after{animation:none;}
  }
  .cent-backnote{
    font-size:11px; color:var(--highlight-2); line-height:1.6; margin-top:14px;
    background:color-mix(in srgb, var(--highlight-2) 7%, transparent); border:1px solid color-mix(in srgb, var(--highlight-2) 25%, transparent);
    border-radius:8px; padding:11px 13px;
  }

  /* Gallery */
  .gallery-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-top:10px;
  }
  .gallery-card summary{
    cursor:pointer; font-size:14px; color:var(--text); text-transform:uppercase;
    font-weight:600; letter-spacing:0.02em; list-style:none;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .gallery-card summary::-webkit-details-marker{display:none;}
  .gallery-card summary::after{
    content:'+'; color:var(--accent); font-size:20px; line-height:1; flex-shrink:0; font-weight:400;
  }
  .gallery-card[open] summary::after{content:'\2212';}
  .gallery-card[open] summary{margin-bottom:14px;}
  .gallery-card summary:hover{color:var(--accent);}
  .gallery-pair{display:flex; gap:8px;}
  .gallery-pair figure{margin:0; flex:1; min-width:0;}
  .gallery-pair img{width:100%; height:220px; object-fit:contain; background:var(--panel-2); border-radius:6px; border:1px solid var(--line);}
  .gallery-pair figcaption{
    font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted);
    text-align:center; margin-top:6px;
  }
  .gallery-note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6;}

  /* Shows */
  .show-card{
    display:flex; gap:14px; align-items:flex-start;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:14px; text-decoration:none;
  }
  .show-card:hover{border-color:var(--accent);}
  .show-date{
    flex-shrink:0; width:60px; text-align:center; background:var(--panel-2);
    border:1px solid var(--line); border-radius:6px; padding:8px 3px;
  }
  .show-date .month{font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(12px * var(--ds)); color:var(--highlight); display:block;}
  .show-date .day{font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(17px * var(--ds)); color:var(--text); display:block; margin-top:4px; white-space:nowrap;}
  .show-info .name{font-size:14px; font-weight:700; color:var(--text);}
  .show-info .loc{font-size:12px; color:var(--muted); margin-top:3px;}
  .show-info .link-label{font-size:12px; color:var(--accent); margin-top:6px;}
  .shows-empty{
    font-size:13px; color:var(--muted); text-align:center; padding:24px 0;
    border:1px dashed var(--line); border-radius:var(--radius); margin-top:14px;
  }

  /* FAQ */
  .faq-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    margin-top:10px; padding:14px 16px;
  }
  .faq-item summary{
    cursor:pointer; font-weight:600; color:var(--text); font-size:14px;
    list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary::after{
    content:'+'; color:var(--accent); font-size:18px; flex-shrink:0; font-weight:400;
  }
  .faq-item[open] summary::after{content:'\2212';}
  .faq-answer{margin-top:12px; font-size:13px; color:var(--muted); line-height:1.7;}
  .faq-answer p{margin:0 0 12px;}
  .faq-answer p:last-child{margin-bottom:0;}

  /* Track Your Submission */
  .trk-form{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
  .trk-form .field{flex:1 1 180px; margin-bottom:0;}
  .trk-form .btn{flex:0 0 auto;}
  .trk-form input#trk-ref{text-transform:uppercase; letter-spacing:1px;}
  .trk-result{margin-top:22px;}
  .trk-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .trk-ref{font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style); font-size:calc(17px * var(--ds)); color:var(--accent); letter-spacing:1px;}
  .trk-hello{font-size:13px; color:var(--muted); margin-top:6px;}
  .trk-status{text-align:right;}
  .trk-status .lbl{font-size:11px; color:var(--muted); letter-spacing:1px;}
  .trk-status .val{font-size:18px; font-weight:700; color:var(--highlight-2); margin-top:2px;}
  .trk-status .upd{font-size:12px; color:var(--muted); margin-top:2px;}
  .trk-flag{border:1px solid var(--highlight); background:color-mix(in srgb, var(--highlight) 10%, transparent); color:var(--text); border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:16px;}
  .trk-steps{list-style:none; margin:0 0 18px; padding:0; position:relative;}
  .trk-steps li{position:relative; padding:0 0 16px 34px; font-size:14px; color:var(--muted);}
  .trk-steps li:last-child{padding-bottom:0;}
  .trk-steps li::before{content:''; position:absolute; left:8px; top:20px; bottom:-2px; width:2px; background:var(--line);}
  .trk-steps li:last-child::before{display:none;}
  .trk-steps .dot{position:absolute; left:0; top:1px; width:18px; height:18px; border-radius:50%; border:2px solid var(--line); background:var(--panel-2); box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--on-accent); font-weight:700;}
  .trk-steps li.done{color:var(--text);}
  .trk-steps li.done .dot{background:var(--accent); border-color:var(--accent);}
  .trk-steps li.done::before{background:var(--accent);}
  .trk-steps li.current{color:var(--highlight-2); font-weight:700;}
  .trk-steps li.current .dot{background:var(--highlight-2); border-color:var(--highlight-2); box-shadow:0 0 0 4px color-mix(in srgb, var(--highlight-2) 18%, transparent);}
  .trk-steps .when{display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:2px;}
  .trk-note{border-left:3px solid var(--highlight); background:var(--panel-2); padding:12px 14px; border-radius:0 6px 6px 0; margin-bottom:16px; font-size:14px; white-space:pre-line;}
  .trk-note .lbl{display:block; font-size:11px; color:var(--highlight); letter-spacing:1px; margin-bottom:4px;}
  .trk-sub{font-size:11px; color:var(--accent); letter-spacing:1px; margin:0 0 8px;}
  .trk-cards{list-style:none; margin:0; padding:0; font-size:14px;}
  .trk-cards li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line);}
  .trk-cards li span:last-child{color:var(--muted); text-align:right;}
  .trk-tracking{font-size:14px; margin-bottom:16px;}
  .trk-tracking b{color:var(--accent); letter-spacing:1px;}
  .trk-card{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden;}
  .trk-card > summary{list-style:none; cursor:pointer; padding:12px 14px;}
  .trk-card > summary::-webkit-details-marker{display:none;}
  .trk-card[open] > summary{border-bottom:1px solid var(--line);}
  .tc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .tc-name b{display:block; font-size:14px; color:var(--text);}
  .tc-svc{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
  .tc-status{font-size:13px; font-weight:700; color:var(--highlight-2); text-align:right; white-space:nowrap;}
  .tc-status.warn{color:var(--highlight);}
  .trk-bar{display:flex; gap:4px;}
  .trk-bar span{flex:1; height:6px; border-radius:3px; background:var(--line);}
  .trk-bar span.on{background:var(--accent);}
  .trk-bar.is-hold span.on{background:var(--highlight);}
  .trk-bar.is-cancelled span{background:var(--line);}
  .tc-body{padding:14px;}
  .tc-body .trk-steps{margin-bottom:12px;}
  .tc-body > :last-child{margin-bottom:0;}
  @media (max-width:520px){ .trk-status{text-align:left;} .trk-form .btn{width:100%;} }

  /* Form */
  .card-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-top:20px;
  }
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .field .req{color:var(--highlight);}
  .field .hint-inline{color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0;}
  .referral-msg{font-size:12px; margin-top:6px; min-height:16px;}
  .referral-msg.ok{color:var(--accent);}
  .referral-msg.err{color:var(--highlight);}
  .checkbox-field{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:12px 14px;}
  .checkbox-label{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text);
    cursor:pointer; margin-bottom:0;
  }
  .checkbox-label input[type=checkbox]{width:17px; height:17px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}
  .checkbox-field .detail-hint{margin-top:8px; margin-left:27px;}
  .card-entry{
    border:1.5px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px;
    background:color-mix(in srgb, var(--text) 1.5%, transparent);
  }
  .card-entry-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
  }
  .card-entry-head h4{margin:0; font-size:13px; color:var(--accent); letter-spacing:0.03em;}
  .remove-card-btn{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:11px;
    padding:6px 10px; border-radius:6px; cursor:pointer;
  }
  .remove-card-btn:hover{border-color:var(--highlight); color:var(--highlight);}
  .terms-link{
    background:none; border:none; padding:0; color:var(--accent); text-decoration:underline;
    font-family:inherit; font-size:inherit; cursor:pointer;
  }
  .checkbox-label input:disabled{cursor:not-allowed; opacity:0.6;}

  /* Embedded Terms & Conditions */
  .terms-embed{
    margin-top:18px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; overflow:hidden; transition:border-color .2s ease;
  }
  .terms-embed.accepted{border-color:var(--accent);}
  .terms-embed-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--text) 2%, transparent);
  }
  .terms-embed-title{
    font-size:12px; font-weight:700; color:var(--text);
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .terms-embed-status{font-size:10px; color:var(--muted); letter-spacing:0.03em; white-space:nowrap;}
  .terms-embed-status.ok{color:var(--accent);}

  .terms-embed-scroll{
    max-height:260px; overflow-y:auto; padding:14px;
    font-size:12px; color:var(--muted); line-height:1.65;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    background:
      linear-gradient(var(--panel-2) 30%, transparent) top / 100% 24px no-repeat,
      linear-gradient(transparent, var(--panel-2) 70%) bottom / 100% 24px no-repeat;
    background-attachment:local, local;
  }
  .terms-embed-scroll h4{color:var(--text); font-size:12px; margin:16px 0 6px;}
  .terms-embed-scroll h4:first-child{margin-top:0;}
  .terms-embed-scroll p{margin:0 0 9px;}
  .terms-embed-scroll .surcharge-table{margin:8px 0;}
  .terms-ack-block{
    margin-top:18px; padding:12px; border-radius:6px;
    background:color-mix(in srgb, var(--accent) 6%, transparent); border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .terms-ack-block h4{color:var(--accent); margin-top:0;}
  .terms-ack-block p{color:var(--text); margin-bottom:0;}

  .terms-embed-foot{padding:12px 14px; border-top:1px solid var(--line);}
  .scroll-hint{font-size:11px; color:var(--muted); text-align:center; margin-bottom:9px;}
  .terms-embed-foot .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .terms-accepted-note{
    display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap;
    font-size:12px; color:var(--accent); font-weight:600; padding:9px 0;
  }
  .ta-check{font-size:15px;}
  .ta-undo{
    background:none; border:none; color:var(--muted); font-size:11px;
    text-decoration:underline; cursor:pointer; padding:0; font-family:inherit;
  }
  .ta-undo:hover{color:var(--highlight);}
  .delivery-toggle{display:flex; flex-direction:column; gap:8px;}
  .delivery-option{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text);
    background:var(--panel-2); border:1.5px solid var(--line); border-radius:6px;
    padding:12px 14px; cursor:pointer;
  }
  .delivery-option:has(input:checked){border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .delivery-option input{accent-color:var(--accent); width:16px; height:16px; flex-shrink:0; cursor:pointer;}
  .field input[type=text], .field input[type=email], .field input[type=tel], .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:6px; font-family:var(--font-body); font-size:14px;
  }
  .field textarea{resize:vertical; min-height:80px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .row2{display:flex; gap:12px;}
  .row2 .field{flex:1;}
  .photo-inputs{display:flex; gap:12px;}
  .photo-slot{flex:1;}
  .photo-slot label{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    border:1.5px dashed var(--line); border-radius:6px; padding:16px 8px; cursor:pointer;
    font-size:11px; color:var(--muted); text-align:center; min-height:96px;
  }
  .photo-slot label:hover{border-color:var(--accent); color:var(--accent);}
  .photo-slot input{display:none;}
  .photo-preview{width:100%; height:100%; object-fit:cover; border-radius:5px;}
  .photo-slot.has-image label{padding:0; border-style:solid; min-height:96px; overflow:hidden;}
  .photo-slot{position:relative;}
  .upload-spinner{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--accent); background:color-mix(in srgb, var(--panel) 40%, transparent); pointer-events:none;
  }
  .detail-thumb{position:relative;}
  .upload-spinner-sm{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--accent); pointer-events:none;
  }
  .detail-upload-label{
    display:inline-block; font-size:12px; color:var(--accent); border:1.5px dashed var(--line);
    padding:10px 14px; border-radius:6px; cursor:pointer; margin-top:12px;
  }
  .detail-upload-label:hover{border-color:var(--accent);}
  .detail-hint{font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5;}
  .detail-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .detail-thumb{position:relative; width:64px; height:64px;}
  .detail-thumb img{width:100%; height:100%; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .detail-thumb button{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--highlight); color:var(--on-highlight); border:none; font-size:12px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .form-msg{font-size:13px; margin-top:14px; line-height:1.6;}
  .form-msg.ok{color:var(--accent);}
  .form-msg.err{color:var(--highlight);}
  .payment-note{
    margin-top:18px; font-size:12px; color:var(--muted); line-height:1.7;
    border-top:1px solid var(--line); padding-top:16px;
  }

  /* Instagram */
  .ig-block{
    display:flex; align-items:center; gap:16px; text-decoration:none;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-top:18px;
  }
  .ig-icon{
    width:46px; height:46px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg, var(--highlight), var(--highlight-2) 60%, var(--accent));
    display:flex; align-items:center; justify-content:center;
  }
  .ig-icon svg{width:24px; height:24px;}
  .ig-text .handle{font-size:15px; font-weight:700; color:var(--text);}
  .ig-text .sub{font-size:12px; color:var(--muted); margin-top:2px;}

  .contact-list{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .contact-row{
    display:flex; align-items:center; gap:12px; text-decoration:none;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px;
  }
  .contact-row:hover{border-color:var(--accent);}
  .contact-icon{
    width:36px; height:36px; border-radius:10px; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .contact-icon svg{width:18px; height:18px;}
  .contact-text{font-size:13px; color:var(--text); font-weight:600;}
  .contact-sub{display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:2px;}

  footer{padding:40px 20px 30px; text-align:center;}
  footer .fname{font-size:11px; color:var(--muted); letter-spacing:0.05em;}
  footer .fyear{font-size:11px; color:var(--muted); margin-top:6px;}

  @media (min-width:600px){
    .hero-ctas{flex-wrap:nowrap;}
  }

  /* Template additions */
  .brand-logo{display:block; height:28px; width:auto; max-width:170px; object-fit:contain;}
  .hero.no-image{padding-top:56px;}
  .card-entry-head h4{font-size:calc(15px * var(--ds));}
  .footer-name{font-size:calc(13px * var(--ds)); color:var(--muted);}
  .img-placeholder{
    width:100%; height:220px; border-radius:6px; border:1px dashed var(--line); background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:10px;
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
  }
  .pricing-explainer p{font-size:13px; color:var(--muted); margin:0 0 12px; line-height:1.6;}
  .pricing-explainer p:last-child{margin-bottom:4px;}
  .setup-banner{
    background:color-mix(in srgb, var(--highlight) 14%, var(--bg)); border-bottom:1px solid var(--highlight);
    color:var(--text); font-size:12px; line-height:1.5; padding:8px 16px; text-align:center;
  }
  .setup-banner code{font-size:11px;}
  .ig-icon{color:var(--on-highlight);}
  section[id], #top{scroll-margin-top:84px;}

  /* ================= STYLE VARIANT: bold =================
     theme.variant: 'bold' — wide layout, numbered left-aligned headings,
     angled stripe dividers, price cards, slanted buttons, sharp corners. */
  .v-bold{counter-reset:sec;}
  .v-bold body{
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -10%, var(--glow-a), transparent 60%),
      repeating-linear-gradient(-55deg, color-mix(in srgb, var(--accent) 3%, transparent) 0 1px, transparent 1px 22px);
  }
  .v-bold{--radius:3px;}
  /* header */
  .v-bold .header-inner{padding:12px 20px;}
  .v-bold .brand-logo{height:40px;}
  .v-bold .header-nav{gap:18px;}
  .v-bold .header-nav a{font-family:var(--font-display); font-weight:var(--display-weight); font-style:var(--display-style);
    text-transform:uppercase; letter-spacing:.04em; font-size:calc(13px * var(--ds)); color:var(--text); padding:4px 0; border-bottom:2px solid transparent;}
  .v-bold .header-nav a:hover{color:var(--accent); border-bottom-color:var(--accent);}
  .v-bold header{border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent);}
  /* buttons */
  .v-bold .btn{border-radius:2px; letter-spacing:.05em; padding:14px 26px;}
  .v-bold .btn-primary{clip-path:polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); padding-left:30px; padding-right:30px;}
  .v-bold .btn-block.btn-primary{clip-path:none;}
  /* section headings: numbered, left aligned, gold rule */
  .v-bold section{padding-top:64px; padding-bottom:8px;}
  .v-bold .section-head{margin-bottom:30px; position:relative;}
  .v-bold .section-head h2{counter-increment:sec; font-size:calc(34px * var(--ds)); line-height:1.05; margin:0 0 12px; letter-spacing:.01em;}
  .v-bold .section-head h2::before{
    content:counter(sec, decimal-leading-zero); display:block; font-size:calc(13px * var(--ds)); letter-spacing:.2em;

const C = CONFIG, WD = C.words;
const $ = id => document.getElementById(id);
const cap = s => { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };
function T(s){
  return String(s == null ? '' : s)
    .replace(/\{item\}/g, WD.item).replace(/\{items\}/g, WD.items)
    .replace(/\{Item\}/g, cap(WD.item)).replace(/\{Items\}/g, cap(WD.items))
    .replace(/\{ITEM\}/g, WD.item.toUpperCase()).replace(/\{ITEMS\}/g, WD.items.toUpperCase())
    .replace(/\{business\}/g, C.brand.name).replace(/\{BUSINESS\}/g, C.brand.name.toUpperCase())
    .replace(/\{fallback\}/g, (C.contact && C.contact.fallback) || 'contact us');
}
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function attr(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function plain(html){ const d = document.createElement('textarea'); d.innerHTML = String(html == null ? '' : html); return d.value.replace(/<[^>]+>/g, ''); }
const money = n => C.pricing.currency + Number(n).toLocaleString('en-US');
const ENDPOINT = (C.backend.endpoint || '').trim();
const ORDER = (C.layout.order || []).slice();
const has = key => ORDER.indexOf(key) !== -1;
function setMsg(el, html, kind){ el.innerHTML = html || ''; el.className = 'form-msg' + (kind ? ' ' + kind : ''); }

/* ---------- Pricing model (shared by ladder, calculator, form) ---------- */
const P = C.pricing;
const ADDON = (P.addon && P.addon.show) ? P.addon : null;
const ALL_TIERS = [];
(P.groups || []).forEach(g => g.tiers.forEach(t => ALL_TIERS.push(Object.assign({}, t, { surcharge: !!g.surcharge }))));
if(ADDON) ALL_TIERS.push({ title: ADDON.title, price: ADDON.price, desc: ADDON.desc, isAddon: true, surcharge: false });
const BULK = (P.bulk && P.bulk.bands && P.bulk.bands.length) ? P.bulk.bands.slice().sort((a, b) => a.min - b.min) : null;
function bulkPrice(qty){ let p = BULK[0].price; BULK.forEach(b => { if(qty >= b.min) p = b.price; }); return p; }
function bulkRangeLabel(i){ const b = BULK[i], n = BULK[i + 1]; return n ? `${b.min}–${n.min - 1}` : `${b.min}+`; }
function bulkSub(){ return 'Bulk pricing: ' + BULK.slice(1).map((b, j) => `${money(b.price)}/${WD.item} for ${bulkRangeLabel(j + 1)} ${WD.items}`).join(', ') + '.'; }
function bulkShort(){ return BULK.slice(1).map(b => `${money(b.price)} at ${b.min}+`).join(', '); }
const SUR = (P.surcharge && P.surcharge.show) ? P.surcharge : null;
const SUR_MAX = SUR ? SUR.bands[SUR.bands.length - 1].upTo : Infinity;
function surchargeForValue(v){
  if(!SUR || !v) return 0;
  for(const b of SUR.bands){ if(v <= b.upTo) return b.rate ? Math.ceil(v * b.rate) : 0; }
  if(SUR.customAbove) return null;
  return Math.ceil(v * SUR.bands[SUR.bands.length - 1].rate);
}
function surchargeRows(){
  const pct = r => (Math.round(r * 1000) / 10) + '%';
  const rows = SUR.bands.map((b, i) => {
    const last = i === SUR.bands.length - 1;
    const range = i === 0 ? `${money(b.upTo)} or less`
      : (last && !SUR.customAbove) ? `${money(SUR.bands[i - 1].upTo + 1)}+`
      : `${money(SUR.bands[i - 1].upTo + 1)} – ${money(b.upTo)}`;
    return { range, fee: b.rate ? `${pct(b.rate)} ${T(SUR.rateSuffix)}` : T(SUR.freeLabel) };
  });
  if(SUR.customAbove) rows.push({ range: `Over ${money(SUR_MAX)}`, fee: T(SUR.customLabel) });
  return rows;
}
function surchargeTableHtml(){
  if(!SUR) return '';
  return `<div class="surcharge-table"><div class="surcharge-row surcharge-header"><span class="val">${T(SUR.valueHeader)}</span><span class="fee">${T(SUR.feeHeader)}</span></div>` +
    surchargeRows().map(s => `<div class="surcharge-row"><span class="val">${s.range}</span><span class="fee">${s.fee}</span></div>`).join('') + '</div>';
}
function tiersHtml(tiers){ return P.layout === 'cards' ? priceCardsHtml(tiers) : ladderHtml(tiers); }
function tierSub(t){ return t.sub || (t.bulk && BULK ? bulkSub() : t.isAddon && ADDON.comboPrice != null ? `Only ${money(ADDON.comboPrice)} when combined with another service.` : ''); }
function priceCardsHtml(tiers){
  return `<div class="price-grid">` + tiers.map(t => {
    const sub = tierSub(t);
    return `<article class="price-card${t.featured ? ' featured' : ''}">` +
      (t.featured ? `<div class="pc-flag">${T(t.featured === true ? 'Featured' : t.featured)}</div>` : '') +
      `<h3>${t.title}</h3><div class="pc-price pixel">${t.from ? '<span class="pc-from">Starting at</span>' : ''}${money(t.price)}${P.unit ? `<span class="pc-unit">${T(P.unit)}</span>` : ''}</div>` +
      `<p class="pc-desc">${T(t.desc)}</p>` +
      (t.includes && t.includes.length ? `<ul class="tier-includes">${t.includes.map(x => `<li>${T(x)}</li>`).join('')}</ul>` : '') +
      (t.bestFor ? `<p class="tier-best"><b>Best for:</b> ${T(t.bestFor)}</p>` : '') +
      (sub ? `<span class="tier-sub">${T(sub)}</span>` : '') + `</article>`;
  }).join('') + `</div>`;
}
function ladderHtml(tiers){
  return `<div class="ladder">` + tiers.map(t => {
    const sub = t.sub || (t.bulk && BULK ? bulkSub() : t.isAddon && ADDON.comboPrice != null ? `Only ${money(ADDON.comboPrice)} when combined with another service.` : '');
    const pt = money(t.price) + (t.from ? '+' : '');
    return `<div class="tier"><div class="tier-price pixel${pt.length > 3 ? ' long' : ''}">${pt}</div><div class="tier-body"><h3>${t.title}</h3>` +
      `<p>${T(t.desc)}</p>` +
      (t.includes && t.includes.length ? `<ul class="tier-includes">${t.includes.map(x => `<li>${T(x)}</li>`).join('')}</ul>` : '') +
      (t.bestFor ? `<p class="tier-best"><b>Best for:</b> ${T(t.bestFor)}</p>` : '') +
      (sub ? `<p><span class="tier-sub">${T(sub)}</span></p>` : '') + `</div></div>`;
  }).join('') + `</div>`;
}

/* ---------- Section builders ---------- */
const head = (h, p) => `<div class="section-head"><h2 class="pixel">${T(h)}</h2>${p ? `<p>${T(p)}</p>` : ''}</div>`;
const SECTIONS = {
  hero(){
    const h = C.hero;
    const L = h.lockup;
    return `<section class="hero${h.image || L ? '' : ' no-image'}">` +
      (L ? `<div class="hero-lockup">${L.emblem ? `<img class="hl-emblem" src="${attr(L.emblem)}" alt="">` : ''}<div class="hl-word" role="img" aria-label="${attr(plain(T(L.alt || (L.line1 + ' ' + L.line2))))}"><span class="hl-1">${T(L.line1)}</span>${L.line2 ? `<span class="hl-rule"><i></i><b>${T(L.line2)}</b><i></i></span>` : ''}${L.by ? `<span class="hl-by">${T(L.by)}</span>` : ''}</div></div>`
         : h.image ? `<div class="hero-frame${h.imageMaxWidth ? ' boxed' : ''}"><img src="${attr(h.image)}" alt="${attr(T(h.imageAlt))}"></div>` : '') +
      `<div class="hero-text wrap"><div class="tagline"><div class="hero-headline pixel">${T(h.headline)}</div>` +
      `<p class="intro-text">${T(h.sub)}</p></div><div class="hero-ctas">` +
      (h.ctas || []).map(b => `<a href="${attr(b.href)}" class="btn btn-${b.style === 'outline' ? 'outline' : 'primary'}">${T(b.label)}</a>`).join('') +
      `</div></div></section>`;
  },
  promo(){
    const p = C.promo;
    return `<a href="#${attr(p.target || 'tool')}" class="cc-promo wrap" id="promo">` +
      `<span class="cc-promo-icon"><span class="cc-mini-card"><span class="cc-mini-img"></span></span></span>` +
      `<span class="cc-promo-text"><span class="cc-promo-title">${T(p.title)}</span><span class="cc-promo-sub">${T(p.sub)}</span></span>` +
      `<span class="cc-promo-arrow">&rarr;</span></a>`;
  },
  events(){ const e = C.events; return `<section id="events" class="wrap">${head(e.heading, e.intro)}<div id="shows-list"></div></section>`; },
  about(){
    const a = C.about;
    return `<section id="about" class="wrap">${head(a.heading)}` +
      (a.image ? `<img class="about-image" src="${attr(a.image)}" alt="${attr(T(a.imageAlt))}" loading="lazy">` : '') + `<div class="about-copy">` +
      a.paragraphs.map(p => typeof p === 'string' ? `<p>${T(p)}</p>` : p.h ? `<h3 class="about-sub">${T(p.h)}</h3>` : p.lead ? `<p class="about-lead">${T(p.lead)}</p>` : p.steps ? `<ol class="about-steps">${p.steps.map((x, i) => `<li><span>${String(i + 1).padStart(2, '0')}</span>${T(x)}</li>`).join('')}</ol>` : '').join('') + (a.closing ? `<p class="closing">${T(a.closing)}</p>` : '') + `</div></section>`;
  },
  gallery(){
    const g = C.gallery;
    if(g.mode === 'reel'){
      const one = g.items.map((it, i) =>
        `<figure class="reel-card" style="--t:${i % 2 ? 2.2 : -2.2}deg; --dy:${i % 2 ? 10 : 0}px;">` +
        `<span class="fan-img">${it.image ? `<img src="${attr(it.image)}" alt="${attr(plain(T(it.alt || it.title)))}" loading="lazy">` : `<span class="img-placeholder">${T(g.placeholder || 'Card photo')}</span>`}</span>` +
        `<figcaption><b>${T(it.title)}</b>${it.set ? `<span>${T(it.set)}</span>` : ''}${it.tag ? `<em>${T(it.tag)}</em>` : ''}</figcaption></figure>`).join('');
      return `<section id="gallery" class="wrap">${head(g.heading, g.intro)}` +
        `<div class="reel" data-speed="${g.speed || 40}" aria-label="${attr(plain(T(g.heading)))}"><div class="reel-track"><div class="reel-set">${one}</div></div></div>` +
        `${g.note ? `<p class="gallery-note">${T(g.note)}</p>` : ''}</section>`;
    }
    if(g.mode === 'fan'){
      const n = g.items.length, mid = (n - 1) / 2, spread = g.spread || 150, tilt = g.tilt || 7;
      const cards = g.items.map((it, i) => {
        const o = i - mid, x = o * spread, y = Math.abs(o) * Math.abs(o) * 9, r = o * tilt;
        return `<figure class="fan-card" data-i="${i}" style="--x:${x}px; --y:${y}px; --r:${r}deg; --z:${n - Math.round(Math.abs(o) * 2)};" tabindex="0">` +
          `<span class="fan-img">${it.image ? `<img src="${attr(it.image)}" alt="${attr(plain(T(it.alt || it.title)))}" loading="lazy">` : `<span class="img-placeholder">${T(g.placeholder || 'Card photo')}</span>`}</span>` +
          `<figcaption><b>${T(it.title)}</b>${it.set ? `<span>${T(it.set)}</span>` : ''}${it.tag ? `<em>${T(it.tag)}</em>` : ''}</figcaption></figure>`;
      }).join('');
      const roster = g.items.map((it, i) => `<li data-i="${i}"><b>${T(it.title)}</b>${it.set ? `<span>${T(it.set)}</span>` : ''}${it.tag ? `<em>${T(it.tag)}</em>` : ''}</li>`).join('');
      return `<section id="gallery" class="wrap">${head(g.heading, g.intro)}<div class="fan" style="--n:${n}">${cards}</div>` +
        `<ul class="fan-roster">${roster}</ul>${g.note ? `<p class="gallery-note">${T(g.note)}</p>` : ''}</section>`;
    }
    if(g.mode === 'showcase'){
      return `<section id="gallery" class="wrap">${head(g.heading, g.intro)}<div class="showcase-grid">` + g.items.map(it =>
        `<figure class="showcase-card">${it.image ? `<img src="${attr(it.image)}" alt="${attr(T(it.alt || it.title))}" loading="lazy">` : `<div class="img-placeholder">${T(g.placeholder || 'Photo')}</div>`}` +
        `<figcaption>${it.tag ? `<span class="sc-tag">${T(it.tag)}</span>` : ''}<span class="sc-title">${T(it.title)}</span>${it.caption ? `<span class="sc-cap">${T(it.caption)}</span>` : ''}</figcaption></figure>`
      ).join('') + `</div>${g.note ? `<p class="gallery-note">${T(g.note)}</p>` : ''}</section>`;
    }
    const fig = (src, alt, label) => `<figure>${src ? `<img src="${attr(src)}" alt="${attr(T(alt))}" loading="lazy">` : `<div class="img-placeholder">${T(label)} photo</div>`}<figcaption>${T(label)}</figcaption></figure>`;
    return `<section id="gallery" class="wrap">${head(g.heading, g.intro)}` + g.items.map(it =>
      `<details class="gallery-card"><summary>${T(it.title)}</summary><div class="gallery-pair">` +
      fig(it.before, it.beforeAlt, g.beforeLabel) + fig(it.after, it.afterAlt, g.afterLabel) + `</div>` +
      (it.note ? `<div class="gallery-note">${T(it.note)}</div>` : '') + `</details>`).join('') + `</section>`;
  },
  pricing(){
    let h = `<section id="pricing" class="wrap">${head(P.heading, P.intro)}`;
    if(P.notice && P.notice.show) h += `<div class="price-notice" role="note"><span class="pn-tag">${T(P.notice.tag)}</span><div>${T(P.notice.html)}</div></div>`;
    (P.groups || []).forEach((g, i) => {
      h += `<div class="ladder-group-label"${i ? ' style="margin-top:36px;"' : ''}>${T(g.label)}</div>` + tiersHtml(g.tiers);
      if(BULK && g.tiers.some(t => t.bulk)){
        h += `<div class="bulk-table" aria-label="${attr(plain(T(P.bulk.label)))}"><div class="surcharge-row surcharge-header"><span class="val">${T(P.bulk.label)}</span><span class="fee">${T(P.bulk.unitLabel)}</span></div>` +
          BULK.map((b, j) => `<div class="surcharge-row"><span class="val">${bulkRangeLabel(j)} ${WD.items}</span><span class="fee">${money(b.price)}</span></div>`).join('') + `</div>`;
      }
    });
    if(ADDON) h += `<div class="ladder-group-label" style="margin-top:36px;">${T(ADDON.groupLabel)}</div>` + tiersHtml([ALL_TIERS[ALL_TIERS.length - 1]]);
    if(SUR){
      h += `<div class="ladder-group-label" style="margin-top:36px;">${T(SUR.groupLabel)}</div>` +
        `<div class="pricing-explainer">${(SUR.explainer || []).map(p => `<p>${T(p)}</p>`).join('')}</div>` +
        surchargeTableHtml() + (SUR.note ? `<div class="surcharge-note">${T(SUR.note)}</div>` : '');
    }
    const K = P.calculator;
    if(K && K.show){
      h += `<div class="ladder-group-label" style="margin-top:36px;">${T(K.label)}</div><div class="calc-panel">
        <div class="field"><label for="calc-service">Service</label><select id="calc-service"></select></div>
        ${ADDON ? `<label class="addon-check" id="calc-crack-wrap" style="margin:-4px 0 16px;"><input type="checkbox" id="calc-crack"> ${T(ADDON.calcCheckbox)} (+${money(ADDON.comboPrice)})</label>` : ''}
        <div class="field"><label for="calc-qty">${T(K.qtyLabel)}</label><input type="text" id="calc-qty" inputmode="numeric" placeholder="1" value="1"></div>
        ${SUR ? `<div class="field" style="margin-bottom:0;"><label for="calc-value">${T(K.valueLabel)} <span class="hint-inline">(optional)</span></label><input type="text" id="calc-value" inputmode="decimal" placeholder="${attr(T(K.valuePlaceholder))}"></div>` : ''}
        ${P.referral.enabled ? `<div class="field" style="margin-bottom:0; margin-top:14px;"><label for="calc-referral">Referral code <span class="hint-inline">(optional)</span></label><input type="text" id="calc-referral" placeholder="e.g. CODE123" autocapitalize="characters"></div>` : ''}
        <div class="calc-result">
          <div class="calc-line"><span id="calc-base-label">Base service</span><span id="calc-base">—</span></div>
          <div class="calc-line" id="calc-crack-line" style="display:none;"><span>${ADDON ? T(ADDON.calcLine) : ''}</span><span id="calc-crack-amt">—</span></div>
          <div class="calc-line" id="calc-surcharge-line" style="display:none;"><span>Value surcharge</span><span id="calc-surcharge">—</span></div>
          <div class="calc-line" id="calc-discount-line" style="display:none;"><span>Referral discount (${Math.round(P.referral.discount * 100)}%)</span><span id="calc-discount">—</span></div>
          <div class="calc-line calc-total"><span>Estimated total</span><span id="calc-total">—</span></div>
        </div>
        <div class="calc-hint" id="calc-hint"></div>
      </div>`;
    }
    return h + `</section>`;
  },
  tool(){
    const t = C.tool;
    const face = (k, label, opt, statusText) => `
      <div class="cent-face">
        <div class="cent-face-head"><span class="cent-side-label">${label}${opt ? ' <span class="cent-optional">optional</span>' : ''}</span><span class="cent-face-status" id="cent-${k}-status">${statusText}</span></div>
        <div class="centering-diagram">
          ${['top', 'left'].map(s => `<div class="cent-input cent-${s}"><input type="number" step="any" min="0" id="cent-${k}-${s}" placeholder="0" aria-label="${label} ${s} border"><label for="cent-${k}-${s}">${cap(s)}</label></div>`).join('')}
          <div class="cent-card-visual"><div class="cent-card-frame${k === 'b' ? ' back-frame' : ''}"><div class="cent-card-img${k === 'b' ? ' back' : ''}" id="cent-img-${k === 'b' ? 'back' : 'front'}"></div><div class="cent-crosshair-v"></div><div class="cent-crosshair-h"></div></div></div>
          ${['right', 'bottom'].map(s => `<div class="cent-input cent-${s}"><input type="number" step="any" min="0" id="cent-${k}-${s}" placeholder="0" aria-label="${label} ${s} border"><label for="cent-${k}-${s}">${cap(s)}</label></div>`).join('')}
        </div>
        <div class="cent-axis-readout" id="cent-${k === 'b' ? 'back' : 'front'}-readout"></div>
      </div>`;
    return `<section id="tool" class="wrap">${head(t.heading, t.intro)}<details class="cent-wrap"><summary>${T(t.openLabel)}</summary>
      <div class="cent-toolbar"><span></span><button type="button" class="cent-reset" id="cent-reset">Reset</button></div>
      <div class="cent-hint">${T(t.hint)}</div>
      <div class="cent-faces">${face('f', 'Front', false, 'Needs 4 values')}${face('b', 'Back', true, 'Not entered')}</div>
      <div class="cent-empty" id="cent-empty"></div>
      <div class="cent-output" id="cent-output" style="display:none;"><div class="cent-summary" id="cent-summary"></div>
        <div class="cent-grades-label">Centering eligibility by grader</div><div class="cent-grades" id="cent-grades"></div><div class="cent-backnote" id="cent-backnote"></div></div>
      <div class="calc-hint">${T(t.footnote)}</div></details></section>`;
  },
  submit(){
    const f = C.form, tm = C.terms;
    const termsBody = `<p><strong>Effective Date: ${T(tm.effectiveDate)}</strong></p>` +
      tm.intro.map(p => `<p>${T(p)}</p>`).join('') +
      tm.sections.map(s => `<h4>${T(s.h)}</h4>` + s.p.map(p => p === '{{surchargeTable}}' ? surchargeTableHtml() : `<p>${T(p)}</p>`).join('')).join('') +
      `<div class="terms-ack-block"><h4>Acknowledgment</h4><p>${T(tm.acknowledgment)}</p><div id="terms-end" aria-hidden="true"></div></div>`;
    return `<section id="submit" class="wrap">${head(f.heading, f.intro)}
    <details class="card-panel" id="submit-panel"><summary>${T(f.openLabel)}</summary>
      <form id="intake-form" novalidate>
        <div class="field"><label for="f-name">Name <span class="req">*</span></label><input type="text" id="f-name" autocomplete="name" required></div>
        <div class="row2">
          <div class="field"><label for="f-email">Email</label><input type="email" id="f-email" autocomplete="email"></div>
          <div class="field"><label for="f-phone">Phone</label><input type="tel" id="f-phone" autocomplete="tel"></div>
        </div>
        <div class="field"><label>${T(f.deliveryLabel)} <span class="req">*</span></label>
          <div class="delivery-toggle">
            <label class="delivery-option"><input type="radio" name="delivery" value="ship" id="f-delivery-ship" checked><span>${T(f.shipLabel)}</span></label>
            <label class="delivery-option"><input type="radio" name="delivery" value="hand" id="f-delivery-hand"><span>${T(f.handLabel)}</span></label>
          </div></div>
        <div id="shipping-fields">
          <div class="field"><label for="f-address">${T(f.addressLabel)} <span class="hint-inline">${T(f.addressHint)}</span></label><textarea id="f-address" autocomplete="street-address" placeholder="${attr(T(f.addressPlaceholder))}"></textarea></div>
          ${f.insured.show ? `<div class="field checkbox-field"><label class="checkbox-label"><input type="checkbox" id="f-insured"><span>${T(f.insured.label)}</span></label><div class="detail-hint">${T(f.insured.hint)}</div></div>` : ''}
        </div>
        ${P.referral.enabled ? `<div class="field"><label for="f-referral">${T(f.referralLabel)} <span class="hint-inline">(optional)</span></label><input type="text" id="f-referral" placeholder="${attr(T(f.referralPlaceholder))}" autocapitalize="characters"><div class="referral-msg" id="referral-msg"></div></div>` : ''}
        <div id="cards-container"></div>
        <button type="button" class="btn btn-outline btn-block" id="add-card-btn">${T(f.addItemLabel)}</button>
        <div class="terms-embed" id="terms-embed">
          <div class="terms-embed-head"><span class="terms-embed-title">${T(tm.title)} <span class="req">*</span></span><span class="terms-embed-status" id="terms-status">Not yet accepted</span></div>
          <div class="terms-embed-scroll" id="terms-scroll" tabindex="0" aria-label="${attr(plain(T(tm.title)))}">${termsBody}</div>
          <div class="terms-embed-foot">
            <div class="scroll-hint" id="scroll-hint">${T(tm.scrollHint)}</div>
            <button type="button" class="btn btn-primary btn-block" id="terms-agree-btn" disabled>${T(tm.agreeLabel)}</button>
            <div class="terms-accepted-note" id="terms-accepted-note" hidden><span class="ta-check">&#10003;</span> ${T(tm.acceptedNote)} <button type="button" class="ta-undo" id="terms-undo-btn">undo</button></div>
          </div>
          <input type="checkbox" id="f-terms" hidden>
          <div class="detail-hint" style="margin:10px 14px 12px;">${T(tm.footnote)}</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:18px;" id="submit-btn">${T(f.submitLabel)}</button>
        <div class="form-msg" id="form-msg" role="status" aria-live="polite"></div>

/* ---------- Referral codes ---------- */
const REFERRAL_DISCOUNT = P.referral.discount;
let validReferralCodes = new Set();
let referralCodesLoaded = !(P.referral.enabled && ENDPOINT);
const referralInput = $('f-referral');
const referralMsg = $('referral-msg');
function checkReferralInput(){
  if(!referralInput) return;
  const code = referralInput.value.trim().toUpperCase();
  if(!code){ referralMsg.textContent = ''; referralMsg.className = 'referral-msg'; return; }
  if(!referralCodesLoaded){ referralMsg.textContent = 'Checking code…'; referralMsg.className = 'referral-msg'; return; }
  if(validReferralCodes.has(code)){
    referralMsg.innerHTML = T(P.referral.okMsg).replace('{pct}', Math.round(REFERRAL_DISCOUNT * 100)); referralMsg.className = 'referral-msg ok';
  } else {
    referralMsg.innerHTML = T(P.referral.badMsg); referralMsg.className = 'referral-msg err';
  }
}
if(referralInput){
  referralInput.addEventListener('input', checkReferralInput);
  referralInput.addEventListener('blur', checkReferralInput);
}
if(P.referral.enabled && ENDPOINT && (has('submit') || has('pricing'))){
  fetch(`${ENDPOINT}?action=referralCodes`)
    .then(r => r.json())
    .then(data => { if(data && data.success && Array.isArray(data.codes)) validReferralCodes = new Set(data.codes.map(c => String(c).toUpperCase())); })
    .catch(err => console.error('Referral code fetch failed:', err))
    .finally(() => { referralCodesLoaded = true; checkReferralInput(); if(typeof runCalculator === 'function') runCalculator(); });
}
