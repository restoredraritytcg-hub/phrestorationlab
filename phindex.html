/* ---------- Price calculator ---------- */
let runCalculator = null;
(function(){
  const sel = $('calc-service');
  if(!sel) return;
  const K = P.calculator;
  sel.innerHTML = ALL_TIERS.map((t, i) => `<option value="${i}">${t.title}${t.isAddon ? ' only' : ''} — ${t.from ? 'from ' : ''}${money(t.price)}</option>`).join('');
  const valueIn = $('calc-value'), refIn = $('calc-referral'), qtyIn = $('calc-qty');
  const crackIn = $('calc-crack'), crackWrap = $('calc-crack-wrap');
  const baseEl = $('calc-base'), baseLabel = $('calc-base-label'), crackLine = $('calc-crack-line'), crackAmt = $('calc-crack-amt');
  const surLine = $('calc-surcharge-line'), surEl = $('calc-surcharge');
  const discLine = $('calc-discount-line'), discEl = $('calc-discount'), totalEl = $('calc-total'), hintEl = $('calc-hint');
  const fmt = n => Number.isInteger(n) ? money(n) : C.pricing.currency + n.toFixed(2);

  function applyDiscountAndTotal(subtotal, refValid){
    if(refValid){
      const discount = Math.round(subtotal * REFERRAL_DISCOUNT * 100) / 100;
      discLine.style.display = 'flex';
      discEl.textContent = `-${C.pricing.currency}${discount.toFixed(2)}`;
      totalEl.textContent = `${C.pricing.currency}${(subtotal - discount).toFixed(2)}`;
    } else {
      discLine.style.display = 'none';
      totalEl.textContent = fmt(subtotal);
    }
  }
  runCalculator = function(){
    const tier = ALL_TIERS[Number(sel.value)];
    const qty = Math.max(1, Math.floor(Number(qtyIn.value.replace(/[^0-9]/g, '')) || 1));
    const perItem = (tier.bulk && BULK) ? bulkPrice(qty) : Number(tier.price);
    if(crackWrap) crackWrap.style.display = tier.isAddon ? 'none' : 'flex';
    const crack = ADDON && !tier.isAddon && crackIn.checked;
    baseLabel.textContent = qty > 1 ? `Base service (${money(perItem)} × ${qty})` : 'Base service';
    baseEl.textContent = money(perItem * qty);
    if(crack){ crackLine.style.display = 'flex'; crackAmt.textContent = `+${money(ADDON.comboPrice * qty)}`; }
    else crackLine.style.display = 'none';
    const basePrice = (perItem + (crack ? ADDON.comboPrice : 0)) * qty;

    const rawValue = valueIn ? valueIn.value.trim() : '';
    const value = rawValue ? Number(rawValue.replace(/[^0-9.]/g, '')) : 0;
    const refCode = refIn ? refIn.value.trim().toUpperCase() : '';
    const refValid = !!refCode && referralCodesLoaded && validReferralCodes.has(refCode);
    const multi = qty > 1 ? ' ' + T(K.multiHint) : '';

    if(!tier.surcharge || !SUR){
      surLine.style.display = 'none';
      applyDiscountAndTotal(basePrice, refValid);
      if(tier.from) totalEl.textContent = 'From ' + totalEl.textContent;
      const upsell = (tier.bulk && BULK && BULK[1] && qty < BULK[1].min) ? ' ' + T(K.bulkUpsell).replace('{n}', BULK[1].min) : '';
      hintEl.innerHTML = T(rawValue && SUR ? K.noSurchargeHint : K.defaultHint) + upsell + (tier.from && K.fromHint ? ' ' + T(K.fromHint) : '');
      return;
    }
    const s = surchargeForValue(value);
    if(rawValue && s === null){
      surLine.style.display = 'none'; discLine.style.display = 'none';
      totalEl.textContent = plain(T(SUR.customLabel));
      hintEl.innerHTML = T(K.customQuoteHint).replace('{max}', money(SUR_MAX));
      return;
    }
    const surcharge = (s || 0) * qty;
    if(surcharge > 0){ surLine.style.display = 'flex'; surEl.textContent = `+${money(surcharge)}`; }
    else surLine.style.display = 'none';
    applyDiscountAndTotal(basePrice + surcharge, refValid);
    if(tier.from) totalEl.textContent = 'From ' + totalEl.textContent;
    hintEl.innerHTML = T(K.defaultHint) + multi + (tier.from && K.fromHint ? ' ' + T(K.fromHint) : '');
  };
  [sel, crackIn].forEach(el => el && el.addEventListener('change', runCalculator));
  [valueIn, refIn, qtyIn].forEach(el => el && el.addEventListener('input', runCalculator));
  runCalculator();
})();

/* ---------- Specialty tool: centering calculator ---------- */
(function(){
  if(!$('cent-reset')) return;
  const STD = C.tool.standards;
  const CENT_EPS = 0.051;
  const frontIds = ['f-top', 'f-left', 'f-right', 'f-bottom'], backIds = ['b-top', 'b-left', 'b-right', 'b-bottom'];
  const allIds = frontIds.concat(backIds);
  const el = {}; allIds.forEach(k => { el[k] = $('cent-' + k); });
  const BORDER = { 'cent-img-front': C.tool.borders.front, 'cent-img-back': C.tool.borders.back };

  const split = (a, b) => { const t = a + b; if(!(t > 0)) return null; const pa = a / t * 100; return { a: pa, b: 100 - pa, worse: Math.max(pa, 100 - pa), better: Math.min(pa, 100 - pa) }; };
  function vals(ids){ const o = {}; for(const id of ids){ const raw = el[id].value.trim(); if(raw === '') return null; const n = Number(raw); if(isNaN(n) || n < 0) return null; o[id.split('-')[1]] = n; } return o; }
  const backLimit = t => t.back === undefined ? null : (typeof t.back === 'object' ? t.back.tcg : t.back);
  function bestTier(std, fw, fb, bw){
    for(const tier of std.tiers){
      const frontOk = tier.frontBest !== undefined ? (fb <= tier.frontBest + CENT_EPS && fw <= tier.front + CENT_EPS) : (fw <= tier.front + CENT_EPS);
      if(!frontOk) continue;
      const bl = backLimit(tier);
      if(bw === null) return { tier, provisional: true, backLimit: bl };
      if(bl === null || bw <= bl + CENT_EPS) return { tier, provisional: false, backLimit: bl };
    }
    return null;
  }
  const pct = n => (Math.round(n * 10) / 10).toFixed(1);
  const splitText = s => `${pct(s.worse)} / ${pct(s.better)}`;
  function barColor(w){
    if(w <= 52) return 'linear-gradient(90deg, var(--success), var(--accent))';
    if(w <= 60) return 'linear-gradient(90deg, var(--accent), var(--primary-light))';
    if(w <= 75) return 'linear-gradient(90deg, var(--highlight-2), var(--highlight))';
    return 'linear-gradient(90deg, var(--highlight), var(--danger))';
  }
  const tierClass = (i, n) => i === 0 ? 'tier-top' : i === 1 ? 'tier-high' : i < n - 1 ? 'tier-mid' : 'tier-low';
  function renderAxes(id, lr, tb){
    const box = $(id);
    if(!lr || !tb){ box.innerHTML = ''; return; }
    box.innerHTML = [{ name: 'L / R', s: lr }, { name: 'T / B', s: tb }].map(r => `<div class="cent-axis-row"><span class="axis-name">${r.name}</span><span class="cent-axis-bar"><span class="cent-axis-fill" style="width:${r.s.worse}%; background:${barColor(r.s.worse)};"></span></span><span class="cent-axis-val">${splitText(r.s)}</span></div>`).join('');
  }
  function paint(id, lr, tb){
    const img = $(id); if(!img) return;
    const b = BORDER[id] || { H: 7.9, V: 5.9 };
    if(!lr || !tb){ img.style.left = img.style.right = (b.H / 2).toFixed(2) + '%'; img.style.top = img.style.bottom = (b.V / 2).toFixed(2) + '%'; return; }
    img.style.left = (b.H * lr.a / 100).toFixed(2) + '%'; img.style.right = (b.H * lr.b / 100).toFixed(2) + '%';
    img.style.top = (b.V * tb.a / 100).toFixed(2) + '%'; img.style.bottom = (b.V * tb.b / 100).toFixed(2) + '%';
  }
  function run(){
    allIds.forEach(k => el[k].classList.toggle('filled', el[k].value.trim() !== ''));
    const f = vals(frontIds), b = vals(backIds);
    const fLR = f ? split(f.left, f.right) : null, fTB = f ? split(f.top, f.bottom) : null;
    const bLR = b ? split(b.left, b.right) : null, bTB = b ? split(b.top, b.bottom) : null;
    const frontOk = !!(fLR && fTB), backOk = !!(bLR && bTB);
    $('cent-f-status').textContent = frontOk ? 'Measured' : 'Needs 4 values'; $('cent-f-status').classList.toggle('ok', frontOk);
    $('cent-b-status').textContent = backOk ? 'Measured' : 'Not entered'; $('cent-b-status').classList.toggle('ok', backOk);
    renderAxes('cent-front-readout', fLR, fTB); renderAxes('cent-back-readout', bLR, bTB);
    paint('cent-img-front', fLR, fTB); paint('cent-img-back', bLR, bTB);
    const empty = $('cent-empty'), out = $('cent-output');
    if(!frontOk){
      empty.textContent = (f && (!fLR || !fTB)) ? "Opposite borders can't both be zero — please check your front measurements." : 'Enter the four front measurements to see your centering results.';
      empty.style.display = 'block'; out.style.display = 'none'; return;
    }
    empty.style.display = 'none'; out.style.display = 'block';
    const fw = Math.max(fLR.worse, fTB.worse), fb = Math.min(fLR.worse, fTB.worse), bw = backOk ? Math.max(bLR.worse, bTB.worse) : null;
    $('cent-summary').innerHTML = `
      <div class="cent-stat"><div class="stat-label">Front — worst axis</div><div class="stat-val" style="color:${fw <= 55 ? 'var(--accent)' : fw <= 65 ? 'var(--highlight-2)' : 'var(--highlight)'};">${pct(fw)}/${pct(100 - fw)}</div></div>
      <div class="cent-stat"><div class="stat-label">Back — worst axis</div><div class="stat-val" style="color:${bw === null ? 'var(--muted)' : bw <= 70 ? 'var(--accent)' : bw <= 90 ? 'var(--highlight-2)' : 'var(--highlight)'};">${bw === null ? '—' : pct(bw) + '/' + pct(100 - bw)}</div></div>`;
    $('cent-grades').innerHTML = Object.keys(STD).map(key => {
      const std = STD[key], res = bestTier(std, fw, fb, bw);
      if(!res) return `<div class="grade-card tier-low"><span class="grader">${std.label}</span><span class="grade-body"><span class="grade-val">${std.below}</span><div class="grade-note">Centering falls outside this grader's published tiers.</div></span></div>`;
      const cls = tierClass(std.tiers.indexOf(res.tier), std.tiers.length);
      const need = `Needs back within ${res.backLimit}/${pct(100 - res.backLimit)} to confirm.`;
      if(res.tier.blackLabel){
        return `<div class="grade-card black-label${res.provisional ? ' bl-provisional' : ''}"><span class="bl-ribbon">${res.tier.ribbon || 'TOP TIER'}</span><span class="grader">${std.label}</span><span class="grade-body"><span class="grade-val">${res.tier.grade} <span class="bl-pristine">${res.tier.badge || ''}</span>${res.provisional ? '<span class="bl-prov-tag"> (front only)</span>' : ''}</span><div class="grade-note">${res.provisional ? 'Front is a perfect 50/50. ' + need : (res.tier.perfectNote || res.tier.name)}</div></span></div>`;
      }
      return `<div class="grade-card ${cls}"><span class="grader">${std.label}</span><span class="grade-body"><span class="grade-val">${res.tier.grade}${res.provisional ? '<span style="font-size:11px; color:var(--muted); font-weight:400;"> (front only)</span>' : ''}</span><div class="grade-note">${res.provisional ? 'Front qualifies. ' + need : res.tier.name}</div></span></div>`;
    }).join('');
    const bn = $('cent-backnote');
    if(!backOk){ bn.style.display = 'block'; bn.innerHTML = 'These are <strong>front-only</strong> estimates — the back can pull any of these down. Add the four back measurements for a complete read.'; }
    else bn.style.display = 'none';
  }
  allIds.forEach(k => el[k].addEventListener('input', run));
  $('cent-reset').addEventListener('click', () => { allIds.forEach(k => { el[k].value = ''; }); run(); });
  run();
})();

/* ---------- Links that open collapsed panels ---------- */
function openTarget(hash){
  if(hash === '#submit' && $('submit-panel')) $('submit-panel').open = true;
  if(hash === '#tool'){ const w = document.querySelector('.cent-wrap'); if(w) w.open = true; }
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  const hash = a.getAttribute('href');
  openTarget(hash);
  if(a.id === 'promo'){
    e.preventDefault();
    const target = document.querySelector(hash);
    if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.replaceState(null, '', hash);
  }
});

/* ---------- Reviews + ticker ---------- */
let rvReviews = [];
function stars(n){ n = Math.max(0, Math.min(5, Math.round(Number(n) || 0))); return '★'.repeat(n) + '☆'.repeat(5 - n); }
const RT_SPEED = C.reviews.tickerSpeed || 55;
function tickerItemHtml(r){
  const item = r.item || r.card;
  const who = esc(r.name) + (item ? ' · ' + esc(item) : '');
  return `<span class="rt-item"><span class="rt-stars">${stars(r.rating)}</span><span class="rt-text">“${esc(r.text)}”</span><span class="rt-who">— ${who}</span></span>`;
}
function renderTicker(){
  const ticker = $('review-ticker'), track = $('rt-track');
  if(!C.reviews.ticker || !has('reviews') || !rvReviews.length){ ticker.hidden = true; track.innerHTML = ''; return; }
  ticker.hidden = false;
  const once = rvReviews.map(tickerItemHtml).join('');
  track.innerHTML = once;
  const viewport = track.parentElement.clientWidth || window.innerWidth;
  let set = once, guard = 0;
  while(track.scrollWidth < viewport && guard++ < 20){ set += once; track.innerHTML = set; }
  track.innerHTML = set + set;
  track.style.setProperty('--rt-dur', Math.max(12, (track.scrollWidth / 2) / RT_SPEED).toFixed(1) + 's');
}
let rtResizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(rtResizeTimer); rtResizeTimer = setTimeout(renderTicker, 250); });
function renderReviewList(){
  const list = $('rv-list'), sum = $('rv-summary');
  if(!list) return;
  if(!rvReviews.length){ list.innerHTML = `<div class="rv-empty">${T(C.reviews.emptyText)}</div>`; sum.hidden = true; return; }
  const avg = rvReviews.reduce((a, r) => a + (Number(r.rating) || 0), 0) / rvReviews.length;
  sum.hidden = false;
  sum.innerHTML = `<span class="rv-avg">${avg.toFixed(1)}</span><span class="rv-sum-meta"><span class="rv-sum-stars">${stars(avg)}</span><br>Based on ${rvReviews.length} review${rvReviews.length > 1 ? 's' : ''}</span>`;
  list.innerHTML = rvReviews.map(r => { const item = r.item || r.card; return `<div class="rv-card"><div class="rv-head"><span class="rv-who">${esc(r.name)}</span><span class="rv-card-stars" aria-label="${Number(r.rating) || 0} out of 5">${stars(r.rating)}</span></div>${item ? `<div class="rv-item-card">${esc(item)}</div>` : ''}<div class="rv-text">${esc(r.text)}</div></div>`; }).join('');
}
if(has('reviews')){
  if(ENDPOINT){
    fetch(`${ENDPOINT}?action=reviews`)
      .then(r => r.json())
      .then(data => { if(data && data.success && Array.isArray(data.reviews)) rvReviews = data.reviews; })
      .catch(err => console.error('Review fetch failed:', err))
      .finally(() => { renderTicker(); renderReviewList(); });
  } else renderReviewList();
}
(function(){
  const rvForm = $('review-form');
  if(!rvForm) return;
  const rvMsg = $('rv-msg');
  let rvRating = 0;
  $('rv-rating').addEventListener('click', e => {
    const btn = e.target.closest('.rv-star'); if(!btn) return;
    rvRating = Number(btn.dataset.v);
    document.querySelectorAll('.rv-star').forEach(s => { const on = Number(s.dataset.v) <= rvRating; s.classList.toggle('on', on); s.setAttribute('aria-pressed', String(Number(s.dataset.v) === rvRating)); });
  });
  rvForm.addEventListener('submit', async e => {
    e.preventDefault();
    setMsg(rvMsg, '');
    const name = $('rv-name').value.trim(), text = $('rv-text').value.trim(), item = $('rv-card').value.trim();
    if(!name || !text) return setMsg(rvMsg, 'Please add your name and a short review.', 'err');
    if(!rvRating) return setMsg(rvMsg, 'Please pick a star rating.', 'err');
    if(!ENDPOINT) return setMsg(rvMsg, T(C.form.messages.notConnected), 'err');
    const btn = rvForm.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Sending…';
    try{
      const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'review', name, rating: rvRating, item, text }) });
      const data = await res.json();
      if(!data || !data.success) throw new Error((data && data.error) || 'failed');
      setMsg(rvMsg, T(C.reviews.thanks), 'ok');
      rvForm.reset(); rvRating = 0;
      document.querySelectorAll('.rv-star').forEach(s => { s.classList.remove('on'); s.setAttribute('aria-pressed', 'false'); });
    }catch(err){
      console.error('Review submit failed:', err);
      setMsg(rvMsg, T(C.reviews.error), 'err');
    }finally{
      btn.disabled = false; btn.innerHTML = T(C.reviews.submitLabel);
    }
  });
})();

/* ---------- Submission form ---------- */
let resetTerms = () => {};
(function(){
  const form = $('intake-form');
  if(!form) return;
  const F = C.form, M = F.messages;
  const formMsg = $('form-msg');
  const submitBtn = $('submit-btn');
  const SUBMIT_LABEL = T(F.submitLabel);
  const CLOUD = C.backend.cloudinaryCloud, PRESET = C.backend.cloudinaryPreset;
  const photosOn = F.photos.show && CLOUD && PRESET;
  let activeUploadCount = 0;

  function serviceOptionsHtml(){
    return `<option value="" disabled selected>${T(F.servicePlaceholder)}</option>` + ALL_TIERS.map(t => {
      const pr = (t.from ? 'starting at ' : '') + money(t.price);
      const label = (t.bulk && BULK) ? `${t.title} — ${pr} (bulk: ${bulkShort()})` : t.isAddon ? `${t.title} only — ${pr}` : `${t.title} — ${pr}`;
      const val = plain(t.isAddon ? `${t.title} only (${pr})` : `${t.title} (${pr})`);
      return `<option value="${attr(val)}"${t.isAddon ? ' data-addon="1"' : ''}>${label}</option>`;
    }).join('');
  }
  function setUploadingState(active){
    if(active){ submitBtn.dataset.uploadBlocked = 'true'; submitBtn.disabled = true; submitBtn.textContent = 'Uploading photos…'; }
    else if(submitBtn.dataset.uploadBlocked === 'true'){ submitBtn.disabled = false; submitBtn.innerHTML = SUBMIT_LABEL; delete submitBtn.dataset.uploadBlocked; }
  }
  function compressToBlob(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1000; let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const previewUrl = canvas.toDataURL('image/jpeg', 0.72);
          canvas.toBlob(blob => resolve({ blob, previewUrl }), 'image/jpeg', 0.72);
        };
        img.onerror = reject; img.src = e.target.result;
      };
      reader.onerror = reject; reader.readAsDataURL(file);
    });
  }
  async function uploadToCloudinary(blob, filename){
    const fd = new FormData(); fd.append('file', blob, filename); fd.append('upload_preset', PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    if(!data.secure_url) throw new Error(data.error ? data.error.message : 'Upload failed');
    return data.secure_url;
  }

  let counter = 0;
  const entries = {};
  const container = $('cards-container');
  function photosHtml(id){
    if(!F.photos.show) return '';
    if(!photosOn) return `<div class="field"><label>${T(F.photos.label)}</label><div class="detail-hint">${T(M.photosOff)}</div></div>`;
    return `<div class="field"><label>${T(F.photos.label)}</label><div class="photo-inputs">
        <div class="photo-slot" id="slot-front-${id}"><label for="f-photo-front-${id}"><span>+ ${T(F.photos.front)}</span></label><input type="file" accept="image/*" id="f-photo-front-${id}"></div>
        <div class="photo-slot" id="slot-back-${id}"><label for="f-photo-back-${id}"><span>+ ${T(F.photos.back)}</span></label><input type="file" accept="image/*" id="f-photo-back-${id}"></div>
      </div>
      <label for="f-photo-details-${id}" class="detail-upload-label">${T(F.photos.detailsButton)}</label>
      <div class="detail-hint">${T(F.photos.detailsHint)}</div>
      <input type="file" accept="image/*" multiple id="f-photo-details-${id}" style="display:none;">
      <div class="detail-thumbs" id="detail-thumbs-${id}"></div></div>`;
  }
  function entryTemplate(id){
    return `<div class="card-entry" data-card-id="${id}">
      <div class="card-entry-head"><h4 class="pixel">${WD.item.toUpperCase()}</h4><button type="button" class="remove-card-btn" data-remove="${id}" style="display:none;">Remove</button></div>
      <div class="field"><label for="f-card-${id}">${T(F.itemNameLabel)} <span class="req">*</span></label><input type="text" id="f-card-${id}" placeholder="${attr(T(F.itemNamePlaceholder))}" required></div>
      ${(F.extraFields || []).length ? `<div class="row2 row2-wrap">${F.extraFields.map(x => `<div class="field"><label for="f-x-${x.key}-${id}">${T(x.label)}</label><input type="text" id="f-x-${x.key}-${id}" placeholder="${attr(T(x.placeholder || ''))}"></div>`).join('')}</div>` : ''}
      ${F.value.show ? `<div class="field"><label for="f-value-${id}">${T(F.value.label)}</label><input type="text" id="f-value-${id}" inputmode="decimal" placeholder="${attr(T(F.value.placeholder))}"></div>` : ''}
      ${ALL_TIERS.length ? `<div class="field"><label for="f-service-${id}">${T(F.serviceLabel)} <span class="req">*</span></label><select id="f-service-${id}" required>${serviceOptionsHtml()}</select>
        ${ADDON ? `<label class="addon-check" id="f-crack-wrap-${id}"><input type="checkbox" id="f-crack-${id}"> ${T(ADDON.formCheckbox)} (+${money(ADDON.comboPrice)})</label>` : ''}</div>` : ''}
      ${F.concerns && F.concerns.options && F.concerns.options.length ? `<div class="field"><label id="f-cc-label-${id}">${T(F.concerns.label)}</label><div class="concern-grid" role="group" aria-labelledby="f-cc-label-${id}">${F.concerns.options.map(o => `<label class="concern-chip"><input type="checkbox" name="f-cc-${id}" value="${attr(plain(T(o)))}"> ${T(o)}</label>`).join('')}</div>${F.concerns.otherLabel ? `<input type="text" id="f-cc-other-${id}" class="concern-other" placeholder="${attr(T(F.concerns.otherLabel))}" aria-label="${attr(plain(T(F.concerns.otherLabel)))}">` : ''}</div>` : ''}
      <div class="field"><label for="f-notes-${id}">${T(F.notesLabel)}</label><textarea id="f-notes-${id}"></textarea></div>
      ${photosHtml(id)}
    </div>`;
  }
  function wirePhotoSlot(id, key){
    const input = $(`f-photo-${key}-${id}`), slot = $(`slot-${key}-${id}`);
    const emptyLabel = `<span>+ ${T(F.photos[key])}</span>`;
    input.addEventListener('change', async () => {
      const file = input.files[0]; if(!file) return;
      let counted = false;
      try{
        const { blob, previewUrl } = await compressToBlob(file);
        slot.classList.add('has-image');
        slot.querySelector('label').innerHTML = `<img class="photo-preview" src="${previewUrl}" alt="" style="opacity:0.5;"><span class="upload-spinner">Uploading…</span>`;
        activeUploadCount++; counted = true; setUploadingState(true);
        const url = await uploadToCloudinary(blob, `${key}-${id}.jpg`);
        if(entries[id]) entries[id].photos[key] = url;
        slot.querySelector('label').innerHTML = `<img class="photo-preview" src="${previewUrl}" alt="${attr(plain(T(F.photos[key])))} photo">`;
      }catch(err){
        console.error('Photo upload failed:', err);
        slot.classList.remove('has-image'); slot.querySelector('label').innerHTML = emptyLabel;
        setMsg(formMsg, T(M.photoFailed), 'err');
      }finally{
        input.value = '';
        if(counted){ activeUploadCount--; setUploadingState(activeUploadCount > 0); }
      }
    });
  }
  function wireDetailPhotos(id){
    const input = $(`f-photo-details-${id}`), thumbs = $(`detail-thumbs-${id}`);
    function render(){
      if(!entries[id]) return;
      thumbs.innerHTML = entries[id].photos.details.map((it, i) => `<div class="detail-thumb"><img src="${it.previewUrl}" alt="" style="${it.status === 'uploading' ? 'opacity:0.5;' : ''}">${it.status === 'uploading' ? '<span class="upload-spinner-sm">…</span>' : ''}<button type="button" data-i="${i}" aria-label="Remove photo">&times;</button></div>`).join('');
      thumbs.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => { entries[id].photos.details.splice(Number(btn.dataset.i), 1); render(); }));
    }
    input.addEventListener('change', async () => {
      const files = [...input.files]; input.value = '';
      for(const file of files){
        if(!entries[id]) return;
        const item = { status: 'uploading', previewUrl: '', url: null };
        entries[id].photos.details.push(item); render();
        let counted = false;
        try{
          const { blob, previewUrl } = await compressToBlob(file);
          item.previewUrl = previewUrl; render();
          activeUploadCount++; counted = true; setUploadingState(true);
          item.url = await uploadToCloudinary(blob, `detail-${id}-${Date.now()}.jpg`);
          item.status = 'done';
        }catch(err){
          console.error('Detail photo upload failed:', err);
          const k = entries[id] ? entries[id].photos.details.indexOf(item) : -1;
          if(k > -1) entries[id].photos.details.splice(k, 1);
          setMsg(formMsg, T(M.photoFailed), 'err');
        }finally{
          if(counted){ activeUploadCount--; setUploadingState(activeUploadCount > 0); }
          render();
        }
      }
    });
  }
  function renumber(){
    const list = [...container.querySelectorAll('.card-entry')];
    list.forEach((el, i) => {
      el.querySelector('.card-entry-head h4').textContent = WD.item.toUpperCase() + ' ' + (i + 1);
      el.querySelector('.remove-card-btn').style.display = list.length > 1 ? 'inline-block' : 'none';
    });
  }
  function addEntry(){
    counter++;
    const id = 'c' + counter;
    entries[id] = { photos: { front: null, back: null, details: [] } };
    container.insertAdjacentHTML('beforeend', entryTemplate(id));
    if(photosOn){ wirePhotoSlot(id, 'front'); wirePhotoSlot(id, 'back'); wireDetailPhotos(id); }
    const svc = $(`f-service-${id}`);
    if(svc) svc.addEventListener('change', () => {
      const solo = !!(svc.selectedOptions[0] && svc.selectedOptions[0].dataset.addon);
      const wrap = $(`f-crack-wrap-${id}`);
      if(wrap){ wrap.style.display = solo ? 'none' : 'flex'; if(solo) $(`f-crack-${id}`).checked = false; }
    });
    container.querySelector(`[data-card-id="${id}"] .remove-card-btn`).addEventListener('click', () => {
      delete entries[id]; container.querySelector(`[data-card-id="${id}"]`).remove(); renumber();
    });
    renumber();
  }
  const ensureEntry = () => { if(!container.querySelector('.card-entry')) addEntry(); };
  $('add-card-btn').addEventListener('click', addEntry);
  addEntry();

  const shipR = $('f-delivery-ship'), handR = $('f-delivery-hand'), shipFields = $('shipping-fields');
  const updateDeliveryUI = () => { shipFields.style.display = shipR.checked ? 'block' : 'none'; };
  shipR.addEventListener('change', updateDeliveryUI); handR.addEventListener('change', updateDeliveryUI); updateDeliveryUI();

  /* Terms: scroll to the end, then accept inline */
  const termsEmbed = $('terms-embed'), termsScroll = $('terms-scroll'), agreeBtn = $('terms-agree-btn'), termsCheckbox = $('f-terms');
  const scrollHint = $('scroll-hint'), termsStatus = $('terms-status'), acceptedNote = $('terms-accepted-note'), termsEnd = $('terms-end');
  let reachedEnd = false;
  function unlockTerms(){
    if(reachedEnd || termsCheckbox.checked) return;
    reachedEnd = true; agreeBtn.disabled = false; scrollHint.innerHTML = T(C.terms.reachedEnd);
  }
  if('IntersectionObserver' in window && termsEnd){
    new IntersectionObserver(ents => { for(const en of ents) if(en.isIntersecting) unlockTerms(); }, { root: termsScroll, threshold: 0 }).observe(termsEnd);
  }
  function checkTermsScroll(){
    if(reachedEnd || termsCheckbox.checked) return;
    if(!termsScroll.clientHeight) return;   // hidden (panel collapsed) — nothing to measure yet
    const noScrollNeeded = termsScroll.scrollHeight <= termsScroll.clientHeight + 4;
    let endVisible = false;
    if(termsEnd){ const r = termsEnd.getBoundingClientRect(), s = termsScroll.getBoundingClientRect(); endVisible = r.top <= s.bottom + 2; }
    const nearBottom = termsScroll.scrollTop + termsScroll.clientHeight >= termsScroll.scrollHeight - 40;
    if(noScrollNeeded || endVisible || nearBottom) unlockTerms();
  }
  function acceptTerms(){
    termsCheckbox.checked = true; termsEmbed.classList.add('accepted');
    agreeBtn.hidden = true; scrollHint.hidden = true; acceptedNote.hidden = false;
    termsStatus.textContent = 'Accepted'; termsStatus.classList.add('ok');
  }
  resetTerms = function(){
    termsCheckbox.checked = false; termsEmbed.classList.remove('accepted');
    agreeBtn.hidden = false; agreeBtn.disabled = true; scrollHint.hidden = false; scrollHint.innerHTML = T(C.terms.scrollHint);
    acceptedNote.hidden = true; termsStatus.textContent = 'Not yet accepted'; termsStatus.classList.remove('ok');
    reachedEnd = false; termsScroll.scrollTop = 0; checkTermsScroll();
  };
  termsScroll.addEventListener('scroll', checkTermsScroll);
  $('submit-panel').addEventListener('toggle', () => { if($('submit-panel').open){ ensureEntry(); setTimeout(checkTermsScroll, 60); } });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(checkTermsScroll, 60));
  window.addEventListener('load', () => setTimeout(checkTermsScroll, 200));
  agreeBtn.addEventListener('click', acceptTerms);
  $('terms-undo-btn').addEventListener('click', resetTerms);
  window.addEventListener('resize', checkTermsScroll);
  checkTermsScroll();

  /* Submit */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    setMsg(formMsg, '');
    if(activeUploadCount > 0) return setMsg(formMsg, T(M.uploading), 'err');

    const name = $('f-name').value.trim(), email = $('f-email').value.trim(), phone = $('f-phone').value.trim();
    const deliveryMethod = handR.checked ? 'Hand delivered' : 'Ship';
    const address = $('f-address').value.trim();
    const insuredShipping = !!($('f-insured') && $('f-insured').checked);
    const referralCode = referralInput ? referralInput.value.trim().toUpperCase() : '';

    const items = [];
    for(const el of container.querySelectorAll('.card-entry')){
      const cid = el.dataset.cardId;
      const itemName = $(`f-card-${cid}`).value.trim();
      const value = $(`f-value-${cid}`) ? $(`f-value-${cid}`).value.trim() : '';
      const svc = $(`f-service-${cid}`);
      let service = svc ? svc.value : '';
      const solo = !!(svc && svc.selectedOptions[0] && svc.selectedOptions[0].dataset.addon);
      const crackEl = $(`f-crack-${cid}`);
      if(service && ADDON && crackEl && crackEl.checked && !solo) service += plain(` + ${ADDON.title} (${money(ADDON.comboPrice)})`);
      let notes = $(`f-notes-${cid}`).value.trim();
      const extra = (F.extraFields || []).map(x => ({ x, v: ($(`f-x-${x.key}-${cid}`) || {}).value ? $(`f-x-${x.key}-${cid}`).value.trim() : '' })).filter(o => o.v);
      const concerns = [...el.querySelectorAll(`input[name="f-cc-${cid}"]:checked`)].map(c => c.value);
      const other = $(`f-cc-other-${cid}`) ? $(`f-cc-other-${cid}`).value.trim() : '';
      if(other) concerns.push('Other: ' + other);
      const noteLines = extra.filter(o => !o.x.appendToName).map(o => plain(T(o.x.label)) + ': ' + o.v);
      if(concerns.length) noteLines.push(plain(T((F.concerns && F.concerns.noteLabel) || 'Concerns')) + ': ' + concerns.join(', '));
      if(notes) noteLines.push(notes);
      notes = noteLines.join('\n');
      const nameParts = extra.filter(o => o.x.appendToName).map(o => o.v);
      if(!itemName || (svc && !service)) return setMsg(formMsg, T(M.missingItem), 'err');
      const ph = entries[cid].photos;
      items.push({ name: nameParts.length ? `${itemName} — ${nameParts.join(' · ')}` : itemName, value, service, notes,
        photos: { front: ph.front, back: ph.back, details: ph.details.filter(d => d.status === 'done').map(d => d.url) } });
    }
    if(!name) return setMsg(formMsg, T(M.missingName), 'err');
    if(!email && !phone) return setMsg(formMsg, T(M.needContact), 'err');
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setMsg(formMsg, 'Please check your email address.', 'err');
    if(!termsCheckbox.checked) return setMsg(formMsg, T(M.needTerms), 'err');
    if(!ENDPOINT) return setMsg(formMsg, T(M.notConnected), 'err');

    const REF_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const rnd = new Uint32Array(6); (window.crypto || window.msCrypto).getRandomValues(rnd);
    const id = F.refPrefix + Array.from(rnd, n => REF_CHARS[n % REF_CHARS.length]).join('');
    const record = { id, name, email, phone, deliveryMethod, address, insuredShipping, referralCode, items, agreedToTerms: true, createdAt: new Date().toISOString() };

    submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
    try{
      const response = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(record) });
      const result = await response.json();
      if(!result || !result.success) throw new Error((result && result.error) || 'submit failed');
      const ref = result.ref || id;
      const count = items.length > 1 ? `${items.length} ${WD.items}` : `your ${WD.item}`;
      const sk = (email ? 'successEmail' : 'successPhone') + (handR.checked && M[(email ? 'successEmail' : 'successPhone') + 'Hand'] ? 'Hand' : '');
      setMsg(formMsg, T(M[sk]).replace('{count}', count).replace('{ref}', esc(ref)).replace('{email}', esc(email)), 'ok');
      if(email && $('trk-ref')){ $('trk-ref').value = ref; $('trk-email').value = email; }
      form.reset(); resetTerms();
      if(referralMsg){ referralMsg.textContent = ''; referralMsg.className = 'referral-msg'; }
      updateDeliveryUI();
      container.innerHTML = ''; Object.keys(entries).forEach(k => delete entries[k]); counter = 0; addEntry();
    }catch(err){
      console.error('Submission error:', err);
      setMsg(formMsg, T(M.error), 'err');
    }finally{
      submitBtn.disabled = false; submitBtn.innerHTML = SUBMIT_LABEL;
    }
  });
})();

/* ---------- Gallery reel: fill the strip, loop seamlessly, pause on tap ---------- */
(function(){
  const reel = document.querySelector('.reel');
  if(!reel) return;
  const track = reel.querySelector('.reel-track'), set = track.querySelector('.reel-set');
  const speed = Number(reel.dataset.speed) || 40;   // pixels per second
  const original = set.innerHTML;
  function build(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ track.innerHTML = `<div class="reel-set">${original}</div>`; return; }
    set.innerHTML = original;
    track.innerHTML = ''; track.appendChild(set);
    let guard = 0;
    while(set.scrollWidth < reel.clientWidth && guard++ < 10) set.insertAdjacentHTML('beforeend', original);
    const copy = set.cloneNode(true); copy.setAttribute('aria-hidden', 'true');
    copy.querySelectorAll('img').forEach(i => { i.alt = ''; i.loading = 'eager'; });
    track.appendChild(copy);
    track.style.setProperty('--reel-dur', Math.max(15, set.scrollWidth / speed).toFixed(1) + 's');
  }
  build();
  let t = null; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 250); });
  reel.addEventListener('click', () => reel.classList.toggle('paused'));
})();

/* ---------- Gallery fan: deal the cards in when scrolled to; roster names lift their card ---------- */
(function(){
  const fan = document.querySelector('.fan');
  if(!fan) return;
  const deal = () => fan.classList.add('dealt');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) deal();
  else new IntersectionObserver((ents, ob) => { if(ents.some(e => e.isIntersecting)){ setTimeout(deal, 120); ob.disconnect(); } }, { threshold: 0.35 }).observe(fan);
  const cards = [...fan.querySelectorAll('.fan-card')], items = [...document.querySelectorAll('.fan-roster li')];
  // Phones: start the swipe row centered on the middle card
  const centerRow = () => { if(fan.scrollWidth > fan.clientWidth + 4){ const c = cards[Math.floor((cards.length - 1) / 2)]; if(c) fan.scrollLeft = c.offsetLeft - (fan.clientWidth - c.offsetWidth) / 2; } };
  if(document.readyState === 'complete') centerRow(); else window.addEventListener('load', centerRow);
  const set = i => { cards.forEach((c, k) => c.classList.toggle('lift', k === i)); items.forEach((li, k) => li.classList.toggle('on', k === i)); };
  items.forEach((li, i) => { li.addEventListener('mouseenter', () => set(i)); li.addEventListener('mouseleave', () => set(-1)); });
  cards.forEach((c, i) => { c.addEventListener('mouseenter', () => set(i)); c.addEventListener('mouseleave', () => set(-1)); c.addEventListener('focus', () => set(i)); c.addEventListener('blur', () => set(-1)); });
})();

/* ---------- Header nav: fade the right edge only when links overflow ---------- */
(function(){
  const nav = $('header-nav');
  const check = () => {
    const over = nav.scrollWidth - nav.clientWidth > 2;
    nav.classList.toggle('is-overflowing', over);
    nav.classList.toggle('at-end', !over || nav.scrollLeft + nav.clientWidth >= nav.scrollWidth - 2);
  };
  nav.addEventListener('scroll', check, { passive: true });
  window.addEventListener('resize', check); window.addEventListener('load', check);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(check);
  check();
})();

/* ---------- Track your submission ---------- */
(function(){
  const tForm = $('track-form');
  if(!tForm) return;
  const K = C.track;
  const tRef = $('trk-ref'), tEmail = $('trk-email'), tBtn = $('trk-btn'), tMsg = $('trk-msg'), tOut = $('trk-result');
  const BTN = T(K.button);
  const fmt = iso => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
  const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; };

  function stepper(stages, idx, when){
    const ol = el('ol', 'trk-steps');
    const lastIdx = idx >= 0 ? idx : stages.reduce((m, s, i) => when[s] ? i : m, -1);
    stages.forEach((s, i) => {
      const cls = idx < 0 ? (i <= lastIdx ? 'done' : '') : (i < idx || (i === idx && i === stages.length - 1)) ? 'done' : (i === idx ? 'current' : '');
      const li = el('li', cls);
      li.appendChild(el('span', 'dot', cls === 'done' ? '✓' : ''));
      li.appendChild(document.createTextNode(s));
      if(when[s] && i <= lastIdx) li.appendChild(el('span', 'when', fmt(when[s])));
      ol.appendChild(li);
    });
    return ol;
  }
  function render(d){
    const HOLD = d.holdStatus || 'On Hold', CANCEL = d.cancelledStatus || 'Cancelled';
    tOut.innerHTML = '';
    const stages = Array.isArray(d.stages) ? d.stages : [];
    const head = el('div', 'trk-head'), left = el('div'), right = el('div', 'trk-status');
    const list = (d.items || d.cards || []).filter(c => c && c.status);
    left.appendChild(el('div', 'trk-ref', d.ref));
    left.appendChild(el('div', 'trk-hello', T(K.hello).replace('{name}', d.name || 'there')));
    right.appendChild(el('div', 'lbl', list.length > 1 ? 'OVERALL STATUS' : 'CURRENT STATUS'));
    right.appendChild(el('div', 'val', d.status));
    if(d.updated) right.appendChild(el('div', 'upd', 'Updated ' + fmt(d.updated)));
    head.append(left, right); tOut.appendChild(head);

    if(list.length > 1) tOut.appendChild(el('div', 'trk-sub', `YOUR ${WD.items.toUpperCase()} (${list.length}) — TAP ONE FOR DETAILS`));
    list.forEach(c => {
      const det = el('details', 'trk-card');
      if(list.length === 1) det.open = true;
      const sum = el('summary'), top = el('div', 'tc-top'), nm = el('div', 'tc-name');
      nm.appendChild(el('b', null, c.name || c.card || cap(WD.item)));
      if(c.service) nm.appendChild(el('span', 'tc-svc', c.service));
      const warn = c.status === CANCEL || c.status === HOLD;
      top.append(nm, el('div', 'tc-status' + (warn ? ' warn' : ''), c.status));
      const bar = el('div', 'trk-bar' + (c.status === CANCEL ? ' is-cancelled' : c.status === HOLD ? ' is-hold' : ''));
      stages.forEach((s, i) => bar.appendChild(el('span', c.stageIndex >= 0 && i <= c.stageIndex ? 'on' : '')));
      sum.append(top, bar); det.appendChild(sum);
      const body = el('div', 'tc-body');
      if(c.stageIndex < 0) body.appendChild(el('div', 'trk-flag', plain(T(c.status === CANCEL ? K.cancelledFlag : K.holdFlag).replace('{status}', c.status))));
      const when = {}; (c.history || []).forEach(h => { when[h.status] = h.at; });
      body.appendChild(stepper(stages, c.stageIndex, when));
      if(c.tracking){ const t = el('div', 'trk-tracking'); t.append('Return tracking #: '); t.appendChild(el('b', null, c.tracking)); body.appendChild(t); }
      if(c.note){ const nn = el('div', 'trk-note'); nn.appendChild(el('span', 'lbl', plain(T(K.noteLabel)))); nn.appendChild(document.createTextNode(c.note)); body.appendChild(nn); }
      det.appendChild(body); tOut.appendChild(det);
    });
    tOut.hidden = false;
  }
  tForm.addEventListener('submit', async e => {
    e.preventDefault();
    const ref = tRef.value.trim(), email = tEmail.value.trim();
    setMsg(tMsg, '');
    if(!ref || !email) return setMsg(tMsg, 'Enter both your reference number and email.', 'err');
    if(!ENDPOINT) return setMsg(tMsg, T(C.form.messages.notConnected), 'err');
    tBtn.disabled = true; tBtn.textContent = 'Checking…';
    try{
      const res = await fetch(`${ENDPOINT}?action=track&ref=${encodeURIComponent(ref)}&email=${encodeURIComponent(email)}`);
      const data = await res.json();
      if(!data || !data.success){
        tOut.hidden = true; tOut.innerHTML = '';
        return setMsg(tMsg, (data && data.error && !/Unknown action/i.test(data.error)) ? esc(data.error) : T(K.lookupError), 'err');
      }
      render(data);
    }catch(err){
      console.error('Track error:', err);
      tOut.hidden = true; setMsg(tMsg, T(K.networkError), 'err');
    }finally{
      tBtn.disabled = false; tBtn.innerHTML = BTN;
    }
  });
  // Links from emails: /?track=REF-XXXXXX#track
  try{
    const q = new URLSearchParams(location.search).get('track');
    if(q){
      tRef.value = q.toUpperCase();
      const go = () => { $('track').scrollIntoView({ block: 'start' }); tEmail.focus({ preventScroll: true }); };
      if(document.readyState === 'complete') go(); else window.addEventListener('load', go);
    }
  }catch(_){}
})();

/* ---------- Arriving on a #hash: content is built by script, so scroll once it exists ---------- */
(function(){
  const h = location.hash;
  if(!h || h.length < 2 || new URLSearchParams(location.search).get('track')) return;
  openTarget(h);
  const go = () => { const t = document.querySelector(h); if(t) t.scrollIntoView({ block: 'start' }); };
  if(document.readyState === 'complete') go(); else window.addEventListener('load', go);
})();
</script>
</body>
</html>
